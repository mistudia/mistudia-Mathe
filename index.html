<!DOCTYPE html>
<!-- ============================================================
     miStudia Mathe – Startmenü
     ------------------------------------------------------------
     Bündelt die Mathe-Apps von miStudia unter einer Adresse (eine
     Domain → eine Android-App ohne Adressleiste). Jede App liegt als
     Unterordner (einmaleins/, schriftlich/, groessen/, brueche/,
     prozent/, waage/, binome/) und bekommt über home-button.js einen
     runden Knopf oben links zurück hierher.
     Sprachauswahl: localStorage "msMathLang" (nur dieses Menü und der
     Hinweistext des Zurück-Knopfs; jede App hat ihre eigene Auswahl).
     ============================================================ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miStudia Mathe</title>
<meta name="description" content="Mathe üben mit miStudia: Einmaleins, schriftlich rechnen, Größen, Brüche, Prozente, Gleichungen und binomische Formeln.">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root { --blue: #1565c0; --bg: #eef5ff; --card: #ffffff; --text: #1a2233; --muted: #4f5b6e; --line: #b0b0b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  main { max-width: 900px; margin: 0 auto; }
  header { text-align: center; padding-top: max(16px, env(safe-area-inset-top)); }
  .logo { width: min(300px, 70vw); height: auto; display: block; margin: 4px auto 0; border-radius: 16px; }
  h1 { font-size: 28px; margin: 8px 0 2px; color: var(--blue); }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0 0 18px; }
  .langs button {
    width: 54px; height: 42px; border-radius: 10px; cursor: pointer; font-size: 24px; line-height: 1;
    background: #1f74e0; border: 0; box-shadow: 0 2px 0 #1452b0; padding: 0;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .langs button[aria-pressed="true"] { outline: 4px solid #ffcc4d; outline-offset: 2px; background: #1452b0; }
  .langs button:focus-visible { outline: 3px solid #ffb300; outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tile {
    display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; text-decoration: none;
    background: var(--card); color: var(--text); border: 2px solid #d3def0;
    box-shadow: 0 2px 8px rgba(21,101,192,0.10); transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(21,101,192,0.18); }
  .tile:focus-visible { outline: 3px solid #ffb300; outline-offset: 2px; }
  .badge {
    flex: 0 0 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    color: #ffffff; font: 900 22px/1 system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
  }
  .tile b { display: block; font-size: 18px; margin-bottom: 2px; color: var(--text); }
  .tile span.desc { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; }
  .tile span.grade {
    display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--blue);
    background: #e3eefc; border-radius: 999px; padding: 2px 8px;
  }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 22px 0 8px; }
  footer a { color: var(--blue); }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="/img/mistudia-logo-learnbygame.png" alt="miStudia – Learn by Game" width="900" height="467">
    <h1 id="title">Mathe</h1>
    <p class="sub" id="sub"></p>
    <div class="langs" role="group" aria-label="Sprache / Language">
      <button type="button" data-l="de" title="Deutsch">🇩🇪</button>
      <button type="button" data-l="en" title="English">🇺🇸</button>
      <button type="button" data-l="es" title="Español">🇪🇸</button>
      <button type="button" data-l="zh" title="中文">🇨🇳</button>
      <button type="button" data-l="fr" title="Français">🇫🇷</button>
      <button type="button" data-l="ru" title="Русский">🇷🇺</button>
      <button type="button" data-l="ar" title="العربية">🇸🇦</button>
      <button type="button" data-l="ja" title="日本語">🇯🇵</button>
      <button type="button" data-l="pt" title="Português">🇧🇷</button>
    </div>
  </header>
  <nav class="grid" id="grid"></nav>
  <footer>
    <a id="privacy" href="/privacy.html">Datenschutz</a> ·
    <a id="imprint" href="https://mistudia.com/impressum" target="_blank" rel="noopener">Impressum</a> ·
    <a href="https://mistudia.com" target="_blank" rel="noopener">mistudia.com</a>
  </footer>
</main>

    desc: { de: "Alle Reihen von 2 bis 10 – schaffst du das Diplom?", en: "All tables from 2 to 10 – can you earn the diploma?", es: "Todas las tablas del 2 al 10 – ¿consigues el diploma?", zh: "2到10的全部乘法表——你能拿到证书吗？", fr: "Toutes les tables de 2 à 10 – obtiendras-tu le diplôme ?", ru: "Все ряды от 2 до 10 – получишь диплом?", ar: "كل الجداول من 2 إلى 10 – هل تحصل على الشهادة؟", ja: "2の段から10の段まで――賞状をもらえるかな？", pt: "Todas as tabuadas de 2 a 10 – você consegue o diploma?" },

  { slug: "brueche", badge: "¾", color: "#ff4f9a",

    desc: { de: "Kürzen, addieren, multiplizieren und mehr", en: "Simplify, add, multiply and more", es: "Simplificar, sumar, multiplicar y más", zh: "约分、加法、乘法等", fr: "Simplifier, additionner, multiplier et plus", ru: "Сокращение, сложение, умножение и многое другое", ar: "الاختصار والجمع والضرب والمزيد", ja: "約分・たし算・かけ算など", pt: "Simplificar, somar, multiplicar e mais" },
    grade: { de: "Klasse 5–7", en: "Grade 5–7", es: "Curso 5–7", zh: "5–7年级", fr: "6e–4e", ru: "5–7 класс", ar: "الصف 5–7", ja: "5〜7年生", pt: "5º–7º ano" } },
  { slug: "prozent", badge: "%", color: "#a855f7",
    name: { de: "Prozente & Dezimalzahlen", en: "Percent & Decimals", es: "Porcentajes y decimales", zh: "百分数与小数", fr: "Pourcentages et décimaux", ru: "Проценты и десятичные дроби", ar: "النسب المئوية والكسور العشرية", ja: "百分率と小数", pt: "Porcentagem e decimais" },
    desc: { de: "Dezimalzahl, Prozent und Bruch umwandeln", en: "Convert decimals, percentages and fractions", es: "Convertir decimales, porcentajes y fracciones", zh: "小数、百分数和分数互相转换", fr: "Convertir décimaux, pourcentages et fractions", ru: "Переводить десятичные дроби, проценты и обыкновенные дроби", ar: "التحويل بين الكسور العشرية والنسب المئوية والكسور", ja: "小数・百分率・分数を変換", pt: "Converter decimais, porcentagens e frações" },
    grade: { de: "Klasse 6–7", en: "Grade 6–7", es: "Curso 6–7", zh: "6–7年级", fr: "5e–4e", ru: "6–7 класс", ar: "الصف 6–7", ja: "6〜7年生", pt: "6º–7º ano" } },
  { slug: "waage", badge: "⚖", color: "#5b7cfa",
    name: { de: "Mathe-Waage", en: "Equation Balance", es: "Balanza de ecuaciones", zh: "方程天平", fr: "Balance des équations", ru: "Весы уравнений", ar: "ميزان المعادلات", ja: "方程式てんびん", pt: "Balança de equações" },
    desc: { de: "Gleichungen lösen mit der Waage", en: "Solve equations with a balance", es: "Resolver ecuaciones con una balanza", zh: "用天平解方程", fr: "Résoudre des équations avec une balance", ru: "Решать уравнения с помощью весов", ar: "حل المعادلات بالميزان", ja: "てんびんで方程式を解こう", pt: "Resolver equações com uma balança" },

    name: { de: "Binomische Formeln", en: "Binomial Formulas", es: "Fórmulas binómicas", zh: "二项式公式", fr: "Identités remarquables", ru: "Формулы сокращённого умножения", ar: "المتطابقات الشهيرة", ja: "乗法公式", pt: "Produtos notáveis" },
    desc: { de: "Klammern ausmultiplizieren Schritt für Schritt", en: "Expand brackets step by step", es: "Multiplicar paréntesis paso a paso", zh: "一步步展开括号", fr: "Développer pas à pas", ru: "Раскрывать скобки шаг за шагом", ar: "فك الأقواس خطوة بخطوة", ja: "かっこの展開をステップごとに", pt: "Expandir parênteses passo a passo" },

  { slug: "sinus", badge: "sin", color: "#e5484d",
    name: { de: "Sinusfunktionen", en: "Sine Functions", es: "Funciones seno", zh: "正弦函数", fr: "Fonctions sinus", ru: "Синусоиды", ar: "دوال الجيب", ja: "正弦関数", pt: "Funções seno" },
    desc: { de: "Parameter a, b, c, d ausprobieren – im Vergleich zu sin(x)", en: "Try the parameters a, b, c, d – compared with sin(x)", es: "Prueba los parámetros a, b, c, d – comparados con sin(x)", zh: "试试参数 a、b、c、d——与 sin(x) 比较", fr: "Essaie les paramètres a, b, c, d – par rapport à sin(x)", ru: "Попробуй параметры a, b, c, d – по сравнению с sin(x)", ar: "جرّب المعاملات a وb وc وd – مقارنةً بـ sin(x)", ja: "パラメーター a, b, c, d を動かして sin(x) とくらべよう", pt: "Experimente os parâmetros a, b, c, d – comparados com sin(x)" },

var UI = {
  de: { title: "Mathe", sub: "Üben mit Spaß – such dir eine App aus!", privacy: "Datenschutz", imprint: "Impressum" },
  en: { title: "Math", sub: "Practise with fun – pick an app!", privacy: "Privacy", imprint: "Legal notice" },
  es: { title: "Matemáticas", sub: "Practica con diversión – ¡elige una app!", privacy: "Privacidad", imprint: "Aviso legal" },
  zh: { title: "数学", sub: "快乐练习——选一个应用吧！", privacy: "隐私政策", imprint: "法律声明" },
  fr: { title: "Maths", sub: "S’entraîner en s’amusant – choisis une appli !", privacy: "Confidentialité", imprint: "Mentions légales" },
  ru: { title: "Математика", sub: "Учись с удовольствием – выбери приложение!", privacy: "Конфиденциальность", imprint: "Выходные данные" },
  ar: { title: "الرياضيات", sub: "تعلّم بمتعة – اختر تطبيقًا!", privacy: "الخصوصية", imprint: "بيانات قانونية" },
  ja: { title: "算数・数学", sub: "楽しく練習――アプリを選んでね！", privacy: "プライバシー", imprint: "運営者情報" },
  pt: { title: "Matemática", sub: "Pratique se divertindo – escolha um app!", privacy: "Privacidade", imprint: "Aviso legal" }
};
var lang = "de";
try {
  var saved = localStorage.getItem("msMathLang");
  if(saved && UI[saved]) lang = saved;
  else { var nl = (navigator.language || "de").slice(0, 2).toLowerCase(); if(UI[nl]) lang = nl; }
} catch(e){}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function render(){
  var u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = "miStudia " + u.title;
  document.getElementById("title").textContent = u.title;
  document.getElementById("sub").textContent = u.sub;
  document.getElementById("privacy").textContent = u.privacy;
  document.getElementById("imprint").textContent = u.imprint;
  document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.l === lang ? "true" : "false"); });
  document.getElementById("grid").innerHTML = APPS.map(function(a){
    return '<a class="tile" href="/' + a.slug + '/">' +
      '<span class="badge" style="background:' + a.color + ';font-size:' + (a.badge.length > 4 ? 15 : a.badge.length > 2 ? 19 : 26) + 'px">' + esc(a.badge) + '</span>' +
      '<span><b>' + esc(a.name[lang]) + '</b><span class="desc">' + esc(a.desc[lang]) + '</span>' +
      '<span class="grade">' + esc(a.grade[lang]) + '</span></span></a>';
  }).join("");
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){
    lang = b.dataset.l;
    try { localStorage.setItem("msMathLang", lang); } catch(e){}
    render();
  });
});
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
}
</script>
</body>
</html>
