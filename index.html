function klassen(a){ var m = a.grade.de.match(/(\d+)\s*[–-]\s*(\d+)/) || a.grade.de.match(/(\d+)/); return m ? [+m[1], +(m[2] || m[1])] : [1, 13]; }

    '<span class="badge" style="background:' + a.color + ';font-size:' + (a.badge.length > 4 ? 15 : a.badge.length > 2 ? 19 : 26) + 'px">' + esc(a.badge) + '</span>' +

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss"); }
function markiere(txt, w){ var n = norm(txt), out = "", i = 0; w.forEach(function(){}); var treffer = [];
  w.forEach(function(x){ var p = n.indexOf(x); if(p >= 0) treffer.push([p, p + x.length]); });
  treffer.sort(function(a, b){ return a[0] - b[0]; });
  treffer.forEach(function(r){ if(r[0] < i) return; out += esc(txt.slice(i, r[0])) + "<mark>" + esc(txt.slice(r[0], r[1])) + "</mark>"; i = r[1]; });
  return out + esc(txt.slice(i)); }
function suchen(){
  var u = UI[lang], q = norm(document.getElementById("suche").value.trim()), info = document.getElementById("trefferInfo"), tr = document.getElementById("treffer"), st = document.getElementById("stufen");
  if(!q){ info.hidden = true; tr.hidden = true; st.hidden = false; return; }
  var W = q.split(/\s+/).filter(Boolean), IDX = (window.MS_SUCHE && (MS_SUCHE[lang] || MS_SUCHE.de)) || {}, R = [];
  APPS.forEach(function(a){
    var kopf = [a.name[lang], a.desc[lang], a.grade[lang], a.slug].join(" "), teile = IDX[a.slug] || [], punkte = 0, hits = [];
    var alles = norm(kopf + " " + teile.join(" ").replace(/\u0001#[a-z0-9-]+/g, ""));
    if(!W.every(function(w){ return alles.indexOf(w) >= 0; })) return;
    W.forEach(function(w){ if(norm(a.name[lang]).indexOf(w) >= 0) punkte += 10; if(norm(a.desc[lang]).indexOf(w) >= 0) punkte += 4; });
    // Einträge „Text\u0001#unterseite“ (Berühmte Aufgaben): Treffer springt direkt auf die Unterseite
    var ziel = "", proZiel = {};
    teile.forEach(function(x){ var tx = x.split("\u0001"), n = norm(tx[0]); if(tx[1]) proZiel[tx[1]] = (proZiel[tx[1]] || "") + " " + n; });
    // Unterseite, auf der die meisten Suchwörter vorkommen (bei Gleichstand: längster Treffer zuerst)
    var bestP = 0; Object.keys(proZiel).forEach(function(h){ var p = 0; W.forEach(function(w){ if(proZiel[h].indexOf(w) >= 0) p += w.length; }); if(p > bestP){ bestP = p; ziel = h; } });
    teile.forEach(function(x){ var tx = x.split("\u0001"), n = norm(tx[0]); if(tx[1] && ziel && tx[1] !== ziel) return; if(W.some(function(w){ return n.indexOf(w) >= 0; })){ punkte += 1; if(hits.length < 4 && hits.indexOf(tx[0]) < 0) hits.push(tx[0]); } });
    R.push({ a: a, p: punkte, ziel: ziel, hit: hits.map(function(x){ return markiere(x, W); }).join(" · "), name: markiere(a.name[lang], W), desc: markiere(a.desc[lang], W) });
  });
  R.sort(function(x, y){ return y.p - x.p; });
  info.hidden = false; info.textContent = R.length ? u.treffer.replace("{n}", R.length) : u.keine;
  tr.hidden = !R.length; st.hidden = true;
  tr.innerHTML = R.map(function(r){ return kachel(r.a, r); }).join("");
}
