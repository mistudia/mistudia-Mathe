<!DOCTYPE html>
<!-- ============================================================
     dreisatz/index.html – Dreisatz & Zuordnungen (miStudia Mathe)
     Dreisatz Schritt für Schritt (proportional/antiproportional),
     Zuordnungen mit Tabelle und Graph, eigene Tabelle prüfen, Übungsmodus.
     Logik: app.js, Texte: texte.js (9 Sprachen), Sprache aus dem Startmenü.
     ============================================================ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miStudia – Dreisatz &amp; Zuordnungen</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/home-button.css">
<style>
  :root { --blue: #1565c0; --text: #1a2233; --muted: #4f5b6e; --line: #b0b0b8; --kalt: #2563eb; --warm: #dc2626; --gut: #15803d; --schlecht: #b91c1c; --plus: #16a34a; --minus: #c026d3; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #eef5ff; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .app { max-width: 1000px; margin: 0 auto; background: #ffffff; border-radius: 18px; padding: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.10); }
  #logoOben { display: block; margin: 0 auto 10px; max-width: 320px; width: 100%; height: auto; }
  h1 { text-align: center; color: var(--blue); margin: 0 0 10px; font-size: 28px; }
  h2 { color: var(--blue); font-size: 19px; margin: 16px 0 8px; }
  .tabs { display: flex; gap: 4px; justify-content: center; margin: 0 auto 14px; background: #e3eefc; border-radius: 999px; padding: 4px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
  .tabs button { font: 700 15px system-ui, sans-serif; padding: 8px 18px; border-radius: 999px; border: 0; background: transparent; color: var(--blue); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--blue); color: #ffffff; }
  .karte { border: 2px solid #c9dcf2; border-radius: 14px; padding: 12px; margin-bottom: 12px; background: #ffffff; }
  .entdecken { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: start; }
  #thermo { width: 100%; max-width: 170px; height: auto; touch-action: none; cursor: ns-resize; user-select: none; -webkit-user-select: none; }
  .zs.breit { grid-column: 1 / -1; }
  .zs { width: 100%; height: auto; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .zs.ziehbar { cursor: ew-resize; touch-action: none; }
  .gross { font-size: 34px; font-weight: 800; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .gross.kalt { color: var(--kalt); } .gross.warm { color: var(--warm); }
  .zeile { margin: 6px 0; font-size: 17px; line-height: 1.45; }
  .muted { color: var(--muted); }
  .vergleich { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 18px; }
  input.zahl { width: 84px; font: 20px system-ui, sans-serif; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; color: var(--text); background: #ffffff; text-align: center; }
  input.zahl:focus, select:focus { outline: none; border-color: var(--blue); }
  select { font: 20px system-ui, sans-serif; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; color: var(--text); background: #ffffff; }
  .rel { font-size: 30px; font-weight: 800; color: var(--blue); min-width: 1.4em; text-align: center; }
  .alltag { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .alltag div { background: #f4f8ff; border: 1px solid #c9dcf2; border-radius: 12px; padding: 8px 10px; font-size: 15px; line-height: 1.4; }
  .alltag b { color: var(--kalt); font-size: 18px; display: block; }
  .rechnen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 20px; margin-bottom: 8px; }
  .gleich { font-size: 24px; font-weight: 800; }
  .ergebnis { font-size: 26px; font-weight: 800; color: var(--blue); min-width: 2em; }
  .schritte { margin: 6px 0 0; padding-inline-start: 22px; font-size: 17px; line-height: 1.5; }
  .plus { color: var(--plus); font-weight: 700; } .minus { color: var(--minus); font-weight: 700; } .start { color: var(--blue); font-weight: 700; }
  table.regeln { border-collapse: collapse; font-size: 19px; margin: 6px 0; }
  table.regeln td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; }
  table.regeln tr.an td { background: #fef3c7; font-weight: 800; }
  .knopf { font: 700 16px system-ui, sans-serif; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--blue); color: #ffffff; cursor: pointer; }
  .knopf.hell { background: #e3eefc; color: var(--blue); }
  .knopf.zeichen { font-size: 26px; min-width: 64px; padding: 6px 14px; }
  .auftrag { font-size: 20px; line-height: 1.5; margin: 4px 0 10px; }
  .antwortzeile { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meldung { font-weight: 700; font-size: 17px; margin: 10px 0 0; }
  .meldung.gut { color: var(--gut); } .meldung.schlecht { color: var(--schlecht); }
  .punkte { float: inline-end; font-weight: 700; color: var(--muted); }
  /* SVG */
  .achse { stroke: #1a2233; stroke-width: 2; }
  .tick { stroke: #1a2233; stroke-width: 1.4; } .tick.klein { stroke: #8a94a6; stroke-width: 1; }
  .tzahl { fill: #1a2233; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
  .tzahl.neg { fill: var(--kalt); } .tzahl.pos { fill: var(--warm); } .tzahl.null { font-weight: 800; }
  .marke { fill: var(--blue); stroke: #ffffff; stroke-width: 2; }
  .marke.b { fill: #f59e0b; }
  .mtext { fill: var(--blue); font: 800 17px system-ui, sans-serif; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .mtext.b { fill: #b45309; }
  .pfeil { fill: none; stroke-width: 3; stroke-linecap: round; }
  .pfeil.plus { stroke: var(--plus); } .pfeil.minus { stroke: var(--minus); } .pfeil.start { stroke: var(--blue); } .pfeil.gestr { stroke-dasharray: 6 5; }
  .ptext { font: 700 14px system-ui, sans-serif; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .ptext.plus { fill: var(--plus); } .ptext.minus { fill: var(--minus); } .ptext.start { fill: var(--blue); }
  .footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; } .footer a { color: var(--blue); }
  @media (max-width: 600px) {
    body { padding: 6px; } #logoOben { max-width: 210px; } .app { padding: 10px; border-radius: 14px; } h1 { font-size: 22px; }
    .entdecken { grid-template-columns: 110px 1fr; gap: 8px; }
    .gross { font-size: 28px; } .zeile { font-size: 16px; }
    .tabs button { padding: 8px 12px; font-size: 14px; }
  }
  .geteilt { color: #c2410c; font-weight: 800; } .mal { color: #15803d; font-weight: 800; }
  .reihe { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .reihe label { font-weight: 700; }
  .wahl { display: inline-flex; background: #e3eefc; border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .wahl button { font: 700 15px system-ui, sans-serif; padding: 7px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--blue); cursor: pointer; }
  .wahl button[aria-pressed="true"] { background: var(--blue); color: #ffffff; }
  .problem { font-size: 19px; line-height: 1.5; background: #f4f8ff; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .drei { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; gap: 2px 8px; max-width: 560px; margin: 8px 0; font-size: 20px; }
  .drei .kopf { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }
  .drei .wert { background: #ffffff; border: 2px solid #c9dcf2; border-radius: 10px; padding: 6px 10px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .drei .wert.ziel { border-color: var(--blue); background: #e3eefc; }
  .drei .pf { text-align: center; color: var(--muted); }
  .drei .op { font-size: 16px; text-align: center; white-space: nowrap; }
  .drei .schritt { font-size: 13px; color: var(--muted); font-weight: 700; }
  .merke { border-inline-start: 5px solid var(--blue); background: #f4f8ff; padding: 8px 12px; border-radius: 8px; font-size: 16px; line-height: 1.45; }
  table.wt { border-collapse: collapse; font-size: 18px; margin: 8px 0; }
  table.wt th, table.wt td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; min-width: 52px; font-variant-numeric: tabular-nums; }
  table.wt th { background: #e3eefc; color: var(--blue); }
  table.wt td.hinweis { color: var(--muted); font-size: 15px; }
  table.wt input { width: 64px; font: 17px system-ui, sans-serif; padding: 4px; border: 2px solid var(--line); border-radius: 8px; text-align: center; }
  .tabwrap { overflow-x: auto; }
  #graph { width: 100%; max-width: 640px; height: auto; display: block; }
  .g-achse { stroke: #1a2233; stroke-width: 1.6; } .g-gitter { stroke: #c9dcf2; stroke-width: 1; }
  .g-zahl { fill: #4f5b6e; font: 13px system-ui, sans-serif; } .g-kurve { fill: none; stroke: var(--blue); stroke-width: 3; }
  .g-punkt { fill: #f59e0b; stroke: #ffffff; stroke-width: 2; } .g-name { fill: #1a2233; font: 700 15px system-ui, sans-serif; }
  input[type=range] { width: 220px; max-width: 60vw; }
  .knopfreihe { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 600px) { .drei { font-size: 17px; gap: 2px 4px; } .problem { font-size: 17px; } table.wt { font-size: 16px; } table.wt th, table.wt td { padding: 5px 6px; min-width: 40px; } }
</style>
</head>
<body>
<div class="app">
  <img id="logoOben" src="/img/mistudia-logo-learnbygame.png" alt="miStudia – Learn by Game">
  <h1 id="titel">Dreisatz &amp; Zuordnungen</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="drei" aria-selected="true"></button>
    <button type="button" role="tab" data-tab="zuo" aria-selected="false"></button>
    <button type="button" role="tab" data-tab="ueben" aria-selected="false"></button>
  </div>

  <section id="s_drei">
    <div class="karte">
      <div class="reihe">
        <label for="bsp" id="tBsp"></label>
        <select id="bsp"></select>
        <button type="button" class="knopf hell" id="neuZ"></button>
      </div>
      <div class="reihe" id="eigeneBox" hidden>
        <div class="wahl" id="artWahl"><button type="button" data-art="p" aria-pressed="true"></button><button type="button" data-art="a" aria-pressed="false"></button></div>
        <label><span id="tEA"></span> <input class="zahl" id="eA" inputmode="decimal" value="3"></label>
        <label><span id="tEB"></span> <input class="zahl" id="eB" inputmode="decimal" value="4,5"></label>
        <label><span id="tEC"></span> <input class="zahl" id="eC" inputmode="decimal" value="7"></label>
      </div>
      <p class="problem" id="problem"></p>
      <p class="zeile" id="artText"></p>
      <div class="drei" id="drei"></div>
      <p class="zeile" id="antwort"></p>
      <p class="merke" id="merke"></p>
    </div>
  </section>

  <section id="s_zuo" hidden>
    <div class="karte">
      <h2 id="tZuo"></h2>
      <div class="reihe">
        <div class="wahl" id="zArt"><button type="button" data-art="p" aria-pressed="true"></button><button type="button" data-art="a" aria-pressed="false"></button></div>
        <label><span id="tK"></span> <input type="range" id="k" min="0.5" max="12" step="0.5" value="3"> <b id="kWert"></b></label>
      </div>
      <h2 id="tTab"></h2>
      <div class="tabwrap"><table class="wt" id="zTab"></table></div>
      <p class="zeile" id="zEig"></p>
      <p class="zeile" id="zViel"></p>
      <h2 id="tGraph"></h2>
      <svg id="graph" viewBox="0 0 600 380"></svg>
      <p class="zeile muted" id="zGraph"></p>
    </div>
    <div class="karte">
      <h2 id="tPruef"></h2>
      <p class="zeile muted" id="pruefH"></p>
      <div class="tabwrap"><table class="wt" id="pTab"></table></div>
      <button type="button" class="knopf" id="pruefBtn"></button>
      <p class="meldung" id="pErg"></p>
    </div>
  </section>

  <section id="s_ueben" hidden>
    <div class="karte">
      <span class="punkte" id="punkte"></span>
      <p class="auftrag" id="auftrag"></p>
      <div class="tabwrap"><table class="wt" id="uTab" hidden></table></div>
      <div class="antwortzeile" id="antwortzeile"></div>
      <p class="meldung" id="meldung"></p>
      <div class="drei" id="uLoes" hidden></div>
      <p><button type="button" class="knopf hell" id="weiter"></button></p>
    </div>
  </section>
  <div class="footer">© 2026 miStudia – <a href="https://mistudia.com" target="_blank" rel="noopener">mistudia.com</a></div>
</div>
<script src="texte.js"></script>
<script src="app.js"></script>
<script src="/home-button.js"></script>
</body>
</html>
