button:hover{

}

button:active{
    transform:scale(.98);

.primary{

}

.controls{

    display:flex;

    align-items:flex-start;

.controlGroup{

.groupButtons{

.controlGroup button{

.btn-reset{ background:#64748b; }
.btn-reset:hover{ background:#475569; }

.btn-undo{ background:#ec4899; }

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let equation = {
    left:{x:0,c:0},
    right:{x:0,c:0}
};

// Verlauf der Zwischenschritte (Anzeige unter der Waage)
let history = [];

// Zustände vor jeder Umformung – für „Schritt zurück“.
let undoStack = [];

// Die zuletzt geladene (ursprüngliche) Aufgabe, für den "Ursprungsgleichung"-Button
let originalEquation = null;
let originalInputs = null;


// ===================================
// PARSEN
// ===================================

// Wandelt eine Zahl ODER einen Bruch ("3/4", "-1/2", "0.5") in eine Zahl um
function parseNumber(str){

    str = String(str).trim().replace(/,/g, ".");

    if(str === "" || str === "+") return 1;
    if(str === "-") return -1;

    if(str.includes("/")){

        let parts = str.split("/");

        if(parts.length !== 2) return NaN;

        let num = parts[0].trim();
        let den = parts[1].trim();

        if(num === "" || num === "+") num = "1";
        if(num === "-") num = "-1";

        let n = Number(num);
        let d = Number(den);

        if(!Number.isFinite(n) || !Number.isFinite(d) || d === 0) return NaN;

        return n / d;
    }

    return Number(str);
}

// Parst einen linearen Ausdruck OHNE Klammern (z.B. "2x+5-3x", "1/2x+3/4")
function parseLinearTerms(side){

    let xCoeff = 0;
    let constant = 0;

    side = side.replace(/-/g,"+-");

    let terms = side.split("+");

    terms.forEach(term=>{

        term = term.trim();

        if(term==="") return;

        if(term.includes("x")){

            // "3/4x", "x/2", "2x" -> Koeffizient bestimmen
            let coeffStr = term.replace("x","");

            // Form "x/2" bzw. "-x/2" -> "1/2" bzw. "-1/2"
            coeffStr = coeffStr.replace(/^(-?)\//, "$11/");

            if(coeffStr === "" || coeffStr === "-")
                coeffStr = coeffStr + "1";

            xCoeff += parseNumber(coeffStr);

        }else{

            constant += parseNumber(term);
        }
    });

    return {
        x:xCoeff,
        c:constant
    };
}

// Baut aus Koeffizienten wieder einen Ausdrucks-String (für die Klammer-Auflösung)
function formatSignedLinear(xCoeff, cConst){

    let xPart = "";

    if(xCoeff === 1) xPart = "x";
    else if(xCoeff === -1) xPart = "-x";
    else if(xCoeff !== 0) xPart = xCoeff + "x";

    let cPart = "";

    if(cConst !== 0){
        cPart = (cConst > 0 && xPart !== "") ? ("+" + cConst) : String(cConst);
    }

    let result = xPart + cPart;

    return result === "" ? "0" : result;
}

// Löst Klammern wie "2(x+3)" oder "-(x-5)" auf (auch verschachtelt)
function expandParens(str){

    let guard = 0;

    while(str.includes("(") && guard < 30){

        guard++;

        let before = str;

        str = str.replace(/(-?\d*\.?\d*(?:\/\d+(?:\.\d+)?)?)\(([^()]+)\)/, (match, coeffStr, inner)=>{

            let coeff = parseNumber(coeffStr);

            let parsed = parseLinearTerms(inner);

            return formatSignedLinear(
                parsed.x * coeff,
                parsed.c * coeff
            );
        });

        if(str === before) break; // keine gültige Klammer mehr gefunden -> Abbruch
    }

    return str;
}

function parseSide(side){

    // Reine Zahlenprodukte zuerst ausrechnen: "3*4" wird zu "12".
    // Ein Stern vor x bleibt erhalten, damit "2*x" weiterhin als "2x" gilt.
    let numberFactor = "-?(?:\\d*\\.?\\d+(?:\\/\\d+(?:\\.\\d+)?)?)";
    let productPattern = new RegExp("(" + numberFactor + ")\\*(" + numberFactor + ")");

    while(productPattern.test(side)){
        side = side.replace(productPattern, (match, left, right)=>{
            return parseNumber(left) * parseNumber(right);
        });
    }

    side = side.replace(/\*/g, ""); // "2*x" -> "2x", "2*(x+3)" -> "2(x+3)"

    side = expandParens(side);

    return parseLinearTerms(side);
}


// ===================================
// LADEN
// ===================================

function loadEquation(){

    let leftSide =
        document.getElementById(
            "leftEquationInput"
        ).value;

    let rightSide =
        document.getElementById(
            "rightEquationInput"
        ).value;

    let parsedLeft = parseSide(leftSide);
    let parsedRight = parseSide(rightSide);

    if(
        Number.isNaN(parsedLeft.x) ||
        Number.isNaN(parsedLeft.c) ||
        Number.isNaN(parsedRight.x) ||
        Number.isNaN(parsedRight.c)
    ){
        alert(msW("invalid","Bitte eine gültige Gleichung eingeben, z.B. 2x-4x+7"));
        return;
    }

    equation.left = parsedLeft;
    equation.right = parsedRight;

    // Ursprungsgleichung merken (für den "Ursprungsgleichung"-Button)
    originalEquation = {
        left: { x:parsedLeft.x, c:parsedLeft.c },
        right: { x:parsedRight.x, c:parsedRight.c }
    };

    originalInputs = { left: leftSide, right: rightSide };

    history = []; // neue Aufgabe -> Verlauf zurücksetzen
    undoStack = [];

    // Nicht automatisch vereinfacht anzeigen: Eingabe so lassen wie getippt
    rawDisplay = {
        left: formatRawInput(leftSide),
        right: formatRawInput(rightSide)
    };

    resetCleared = false;

    redraw();
}

// Rohanzeige der eingegebenen Gleichung (vor dem Zusammenfassen)
var rawDisplay = null;
var resetCleared = false;

function clearRawDisplay(){
    rawDisplay = null;
}

function saveUndoState(){
    undoStack.push({
        left: { ...equation.left },
        right: { ...equation.right },
        rawDisplay: rawDisplay ? { ...rawDisplay } : null,
        history: history.slice(),
        resetCleared: resetCleared
    });
}

function undoLastStep(){
    let previous = undoStack.pop();

    if(!previous) return;

    equation.left = previous.left;
    equation.right = previous.right;
    rawDisplay = previous.rawDisplay;
    history = previous.history;
    resetCleared = previous.resetCleared;

    renderHistory();
    redraw();
}

// Eingabetext hübsch machen, ohne zu vereinfachen
function formatRawInput(txt){

    let t = String(txt||"").replace(/\s+/g,"");

    if(t === "") return "";

    // Bei Variablen die übliche Kurzschreibweise verwenden: "3*x" -> "3x".
    // Reine Zahlenprodukte bleiben als Multiplikation sichtbar: "3*4" -> "3·4".
    t = t.replace(/\*x/g, "x");
    t = t.replace(/\*/g, "·");
    t = t.replace(/(?!^)([+\-])/g, "\u2009$1\u2009");
    t = t.replace(/-/g, "−");

    return t;
}

// Setzt die Gleichung auf den Ausgangszustand zurück (vor allen Operationen)
// Zweiter Klick = alles leeren (nichts links, nichts rechts, keine Zwischenschritte)
function resetToOriginal(){

    if(!originalEquation) return;

    if(!resetCleared){
        resetCleared = true;
    }else{
        resetCleared = false;
        equation.left = { x:0, c:0 };
        equation.right = { x:0, c:0 };
        history = [];
        rawDisplay = { left:"", right:"" };
        document.getElementById("leftEquationInput").value = "";
        document.getElementById("rightEquationInput").value = "";
        renderHistory();
        redraw();
        return;
    }

    if(originalInputs){
        document.getElementById("leftEquationInput").value = originalInputs.left;
        document.getElementById("rightEquationInput").value = originalInputs.right;
    }

    rawDisplay = {
        left: formatRawInput(document.getElementById("leftEquationInput").value),
        right: formatRawInput(document.getElementById("rightEquationInput").value)
    };

    equation.left = {
        x:originalEquation.left.x,
        c:originalEquation.left.c
    };

    equation.right = {
        x:originalEquation.right.x,
        c:originalEquation.right.c
    };

    redraw();
}


// ===================================
// TEXT
// ===================================

function sideToString(side){

    let parts = [];

    if(side.x !== 0){

        if(side.x === 1)
            parts.push("x");

        else if(side.x === -1)
            parts.push("−x");

        else{
            let coeffStr = toFraction(side.x);
            if(coeffStr.startsWith("-"))
                parts.push("−" + coeffStr.substring(1) + "x");
            else
                parts.push(coeffStr + "x");
        }
    }

    if(side.c > 0){
        parts.push(toFraction(side.c));
    }

    if(side.c < 0){
        parts.push("−" + toFraction(Math.abs(side.c)));
    }

    if(parts.length === 0)
        return "0";

    let result = parts[0];
    for(let i = 1; i < parts.length; i++){
        if(parts[i].startsWith("−"))
            result += "\u2009−\u2009" + parts[i].substring(1);
        else
            result += "\u2009+\u2009" + parts[i];
    }

    return result;
}

function redraw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let tiltAngle = computeTiltAngle();

    drawBalance(tiltAngle);

    drawSide(
        equation.left,
        300,
        tiltAngle
    );

    drawSide(
        equation.right,
        900,
        tiltAngle
    );

document.getElementById("equationView").innerHTML = `
    <div class="equationLine">
        <div class="eqLeft">
            ${rawDisplay ? rawDisplay.left : sideToString(equation.left)}
        </div>

        <div class="eqEqual">
            =
        </div>

        <div class="eqRight">
            ${rawDisplay ? rawDisplay.right : sideToString(equation.right)}
        </div>
    </div>
`;

    recordHistoryStep();
}

// Merkt sich den aktuellen Stand im Verlauf, falls er sich
// gegenüber dem letzten Schritt verändert hat
function recordHistoryStep(){

    let currentStep =
        rawDisplay
            ? (rawDisplay.left + " = " + rawDisplay.right)
            : (sideToString(equation.left) + " = " + sideToString(equation.right));

    // Geleerter Zustand -> keine Zwischenschritte
    if(rawDisplay && rawDisplay.left === "" && rawDisplay.right === ""){
        return;
    }

    if(
        history.length === 0 ||
        history[history.length - 1] !== currentStep
    ){
        history.push(currentStep);
        renderHistory();
    }
}

function renderHistory(){

    let list = document.getElementById("historyList");

    if(!list) return;

    list.innerHTML = history.map((step)=>{

        return `
            <div class="historyStep">
                <span class="historyEq">${step}</span>
            </div>
        `;
    }).join("");

    list.scrollTop = list.scrollHeight;
}

function computeTiltAngle(){

    let leftWeight =
        Math.abs(equation.left.x)
        + Math.abs(equation.left.c);

    let rightWeight =
        Math.abs(equation.right.x)
        + Math.abs(equation.right.c);

    let angle = 0;

    // Nur kippen wenn KEIN x mehr vorhanden
    // (mit x ist die tatsächliche Gewichtung unbekannt)
    if(
        equation.left.x === 0
        &&
        equation.right.x === 0
    ){

        if(leftWeight > rightWeight){
            angle = -0.14;
        }

        if(rightWeight > leftWeight){
            angle = 0.14;
        }
    }

    return angle;
}

function drawBalance(angle){

    ctx.save();

    // Sockel-Schatten (Bodenkontakt, für mehr Tiefe) – bleibt stehen
    ctx.beginPath();
    ctx.ellipse(600, 518, 100, 12, 0, 0, Math.PI*2);
    ctx.fillStyle = "rgba(15,23,42,0.15)";
    ctx.fill();

    // Ständer (schlanke Säule mit Metallic-Verlauf statt breitem Dreieck) – bleibt stehen
    let columnGradient =
        ctx.createLinearGradient(585,0,615,0);
    columnGradient.addColorStop(0, "#cbd5e1");
    columnGradient.addColorStop(0.5, "#f1f5f9");
    columnGradient.addColorStop(1, "#64748b");

    ctx.fillStyle = columnGradient;

    roundRect(585, 416, 30, 90, 10);
    ctx.fill();

    // Standfuß – bleibt stehen
    ctx.beginPath();
    ctx.ellipse(600, 512, 95, 14, 0, 0, Math.PI*2);

    let baseGradient =
        ctx.createLinearGradient(505,0,695,0);
    baseGradient.addColorStop(0, "#94a3b8");
    baseGradient.addColorStop(0.5, "#e2e8f0");
    baseGradient.addColorStop(1, "#64748b");

    ctx.fillStyle = baseGradient;
    ctx.fill();

    // Ab hier kippt nur der Balken mit Tellern und Nabe
    ctx.translate(600,380);

    ctx.rotate(angle);

    ctx.translate(-600,-380);

    // Balken
    let beamGradient =
        ctx.createLinearGradient(0,372,0,388);
    beamGradient.addColorStop(0, "#cbd5e1");
    beamGradient.addColorStop(1, "#64748b");

    ctx.fillStyle = beamGradient;

    roundRect(
        230,
        372,
        740,
        16,
        8
    );

    ctx.fill();

    drawPlate(300);

    drawPlate(900);

    // Drehpunkt (Nabe) obenauf, mit Glanzlicht
    ctx.beginPath();

    ctx.arc(
        600,
        380,
        34,
        0,
        Math.PI*2
    );

    let hubGradient =
        ctx.createRadialGradient(590,370,4,600,380,34);
    hubGradient.addColorStop(0, "#ffffff");
    hubGradient.addColorStop(0.5, "#cbd5e1");
    hubGradient.addColorStop(1, "#64748b");

    ctx.fillStyle = hubGradient;

    ctx.fill();

    ctx.restore();

    // Vergleichszeichen auf der Nabe (bleibt immer waagrecht)
    let symbol = "=";
    if(angle < -0.001) symbol = ">";   // links schwerer
    else if(angle > 0.001) symbol = "<";

    ctx.save();
    ctx.font = "bold 38px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#0f172a";
    ctx.fillText(symbol, 600, 381);
    ctx.restore();
}

function toFraction(value){

    // Ganze Zahl
    if(Number.isInteger(value))
        return value.toString();

    const tolerance = 0.0001;

    // mögliche Nenner
    let denominators =
        [2,3,4,5,6,8,10,12];

    for(let d of denominators){

        let n = Math.round(value * d);

        if(Math.abs(value - n/d) < tolerance){

            // z.B. 4/2 -> 2
            if(n % d === 0){

                return (n/d).toString();
            }

            return n + "/" + d;
        }
    }

    // FALLBACK:
    // Nachkommastellen entfernen wenn .00
    let rounded =
        Number(value.toFixed(2));

    if(Number.isInteger(rounded)){

        return rounded.toString();
    }

    return rounded.toString();
}



function drawSide(side,centerX,angle){

    angle = angle || 0;

    let items = [];

    // =========================
    // X BOXEN
    // =========================

    let xAbs = Math.abs(side.x);

    let xWhole = Math.floor(xAbs);

    let xFraction = xAbs - xWhole;

    // Ganze x
    for(let i=0;i<xWhole;i++){

        items.push({
            type:"x",
            label: side.x<0 ? "-x" : "x",
            negative:side.x<0
        });
    }

    // Bruch-x
    if(xFraction > 0.001){

        items.push({
            type:"x",
            label:(side.x<0 ? "-" : "") + toFraction(xFraction) + "x",
            negative:side.x<0
        });
    }


    // =========================
    // ZAHLEN
    // =========================

    let cAbs = Math.abs(side.c);

    let cWhole = Math.floor(cAbs);

    let cFraction = cAbs - cWhole;

    // Ganze Kugeln
    for(let i=0;i<cWhole;i++){

        items.push({
            type:"1",
            label: side.c<0 ? "-1" : "1",
            negative:side.c<0
        });
    }

    // Bruchkugel
    if(cFraction > 0.001){

        items.push({
            type:"1",
            label:(side.c<0 ? "-" : "") + toFraction(cFraction),
            negative:side.c<0
        });
    }


    // Schutz: mehr als 100 Elemente pro Seite würden das
    // Zeichnen unbrauchbar/langsam machen -> begrenzen
    const MAX_SCALE_ITEMS = 100;
    let overflow = 0;

    if(items.length > MAX_SCALE_ITEMS){
        overflow = items.length - MAX_SCALE_ITEMS;
        items = items.slice(0, MAX_SCALE_ITEMS);
    }

    // =========================
    // ZEICHNEN (dynamisches Raster,
    // damit auch viele Elemente ~100
    // noch auf die Waage passen)
    // =========================

    const widthBudget = 520;   // verfügbare Breite um centerX herum
    const heightBudget = 260;  // verfügbare Höhe über dem Waagebalken
    const baseRowY = 285;      // unterste Reihe, dicht über dem Teller

    if(items.length > 0){

        ctx.save();
        ctx.translate(600,380);
        ctx.rotate(angle);
        ctx.translate(-600,-380);

        let cols =
            Math.max(
                1,
                Math.min(
                    items.length,
                    Math.round(
                        Math.sqrt(items.length * widthBudget / heightBudget)
                    )
                )
            );

        let rows = Math.ceil(items.length / cols);

        let spacingX = Math.min(70, widthBudget / cols);
        let spacingY = Math.min(74, heightBudget / rows);

        let itemSize =
            Math.max(
                16,
                Math.min(spacingX, spacingY) * 0.74
            );

        items.forEach((item,index)=>{

            let col = index % cols;
            let row = Math.floor(index/cols);

            let currentRowCount =
                Math.min(
                    cols,
                    items.length - row * cols
                );

            let rowWidth =
                (currentRowCount - 1) * spacingX;

            let startX =
                centerX - rowWidth / 2;

            let x =
                startX + col * spacingX;

            let y =
                baseRowY - row * spacingY;

            if(item.type==="x"){

                drawBox(
                    x,
                    y,
                    item.label,
                    item.negative,
                    itemSize
                );

            }else{

                drawBall(
                    x,
                    y,
                    item.label,
                    item.negative,
                    itemSize*0.46
                );
            }
        });

        ctx.restore();
    }

    if(overflow > 0){

        ctx.save();
        ctx.fillStyle = "#1e293b";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.translate(600,380);
        ctx.rotate(angle);
        ctx.translate(-600,-380);
        ctx.fillText(
            "(+" + overflow + " weitere)",
            centerX,
            305
        );
        ctx.restore();
    }
}

roundRect(

// ===================================
// OPERATIONEN
// ===================================

function applyOperation(op,val){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    if(op==="+"){

        equation.left.c += val;
        equation.right.c += val;
    }

    if(op==="-"){

        equation.left.c -= val;
        equation.right.c -= val;
    }

    redraw();
}

function applyMultiply(val){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    equation.left.x *= val;
    equation.left.c *= val;

    equation.right.x *= val;
    equation.right.c *= val;

    redraw();
}

// ===================================
// ×(-1)
// ===================================

function multiplyByNegativeOne(){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    equation.left.x *= -1;
    equation.left.c *= -1;

    equation.right.x *= -1;
    equation.right.c *= -1;

    redraw();
}

// ===================================
// SEITEN TAUSCHEN
// ===================================

function swapSides(){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    let tmp = equation.left;
    equation.left = equation.right;
    equation.right = tmp;

    redraw();
}

function applyDivide(val){

    if(!val || Number.isNaN(val)){
        alert(msW("div0","Division durch 0 ist nicht erlaubt."));
        return;
    }

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;

    equation.left.x /= val;
    equation.left.c /= val;

    equation.right.x /= val;
    equation.right.c /= val;

    redraw();
}

// X ADDITION / SUBTRAKTION
// ===================================

function applyXOperation(op,val){

    saveUndoState();
    if(op === "+"){

        equation.left.x += val;
        equation.right.x += val;
    }

    if(op === "-"){

        equation.left.x -= val;
        equation.right.x -= val;
    }

    redraw();
}

// X MULTIPLIKATION

function applyXMultiply(val){

    saveUndoState();
    equation.left.x *= val;

}

// X DIVISION
// ===================================

function applyXDivide(val){

    if(!val || Number.isNaN(val)){
        alert(msW("div0","Division durch 0 ist nicht erlaubt."));
        return;
    }

    saveUndoState();

    equation.left.x /= val;

}
// ===================================
// +x / -x
// ===================================

function applySingleX(op){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    if(op === "+"){

        equation.left.x += 1;
        equation.right.x += 1;
    }

    if(op === "-"){

        equation.left.x -= 1;
        equation.right.x -= 1;
    }

    redraw();
}


// ===================================
// ·x
// ===================================

function multiplyByX(){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    // Zahlen werden zu x
    equation.left.x += equation.left.c;
    equation.right.x += equation.right.c;

    equation.left.c = 0;
    equation.right.c = 0;

    redraw();
}


// ===================================
// ÷x
// ===================================

function divideByX(){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    // einfache symbolische Division

    if(equation.left.x !== 0){

        equation.left.c =
            equation.left.c / equation.left.x;

        equation.left.x = 1;
    }

    if(equation.right.x !== 0){

        equation.right.c =
            equation.right.c / equation.right.x;

        equation.right.x = 1;
    }

    redraw();
}

// ===================================
// VEREINFACHEN
// ===================================

function simplifyEquation(){

    saveUndoState();
    clearRawDisplay();
    resetCleared = false;


    // Alle x-Terme auf die linke Seite sammeln,
    // alle Zahlen auf die rechte Seite sammeln.
    // (Die alte Version kürzte nur bei GLEICHEM Vorzeichen auf
    // beiden Seiten und tat bei unterschiedlichem Vorzeichen
    // gar nichts - dadurch wirkte "Vereinfachen" oft, als würde
    // es nicht komplett vereinfachen.)

    let newLeftX = equation.left.x - equation.right.x;
    let newRightC = equation.right.c - equation.left.c;

    equation.left = { x:newLeftX, c:0 };
    equation.right = { x:0, c:newRightC };

    redraw();
}


// ===================================
// ROUNDED RECT
// ===================================

function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(x+w,y+h-r);

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(x+r,y+h);

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();
}


// ===================================
// KOMMANDO AUSFÜHREN
// ===================================

function executeCommand(){

    let cmd =
        document.getElementById(
            "commandInput"
        ).value.trim();

    if(cmd === "")
        return;


    // =========================
    // + ZAHL
    // =========================

    if(cmd.startsWith("+")){

        let value =
            cmd.substring(1);

        if(value === "x"){

            applySingleX("+");

            return;
        }

        if(value.includes("x")){

            value =
                Number(
                    value.replace("x","")
                );

            applyXOperation(
                "+",
                value
            );

            return;
        }

        applyOperation(
            "+",
            Number(value)
        );

        return;

    }


    // =========================
    // - ZAHL
    // =========================

    if(cmd.startsWith("-")){

        let value =
            cmd.substring(1);

        if(value === "x"){

            applySingleX("-");

            return;
        }

        if(value.includes("x")){

            value =
                Number(
                    value.replace("x","")
                );

            applyXOperation(
                "-",
                value
            );

            return;
        }

        applyOperation(
            "-",
            Number(value)
        );

        return;
    }


    // =========================
    // MULTIPLIKATION
    // =========================

if(
    cmd.startsWith("·")
    ||
    cmd.startsWith("*")
){

        let value =
            cmd.substring(1);

        if(value === "x"){

            multiplyByX();

            return;
        }

        applyMultiply(
            Number(value)
        );

        return;
    }


    // =========================
    // DIVISION
    // =========================

if(
    cmd.startsWith("÷")
    ||
    cmd.startsWith("/")
){

        let value =
            cmd.substring(1);

        if(value === "x"){

            divideByX();

            return;
        }

        applyDivide(
            Number(value)
        );

        return;
    }
}

}

loadEquation();

// ===================================
// PROBE
// ===================================

// Zahl als HTML mit echtem Bruchstrich (statt "3/4")
function fracHtml(value){

    let txt = toFraction(value);

    let m = txt.match(/^(-?)(\d+)\/(\d+)$/);

    if(!m) return txt;

    return (m[1] === "-" ? "−" : "")
        + '<span class="frac"><span class="num">'
        + m[2]
        + '</span><span class="den">'
        + m[3]
        + '</span></span>';
}

function showProbe(){

    // x berechnen
    let a =
        equation.left.x - equation.right.x;

    let b =
        equation.right.c - equation.left.c;

    if(a === 0){
        alert(msW("noX","x lässt sich hier nicht eindeutig bestimmen (x fällt auf beiden Seiten weg)."));
        return;
    }

    let x = b / a;

    let baseEq = originalEquation
        ? { left:{x:originalEquation.left.x, c:originalEquation.left.c},
            right:{x:originalEquation.right.x, c:originalEquation.right.c} }
        : { left:{x:equation.left.x, c:equation.left.c},
            right:{x:equation.right.x, c:equation.right.c} };

    let leftOriginal =
        document.getElementById(
            "leftEquationInput"
        ).value;

    let rightOriginal =
        document.getElementById(
            "rightEquationInput"
        ).value;

    // x einsetzen (nur zur Anzeige, HTML-sicher escaped)
    function escapeHtml(str){
        return str
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;");
    }

// ======================
// ANZEIGE-VERSION
// ======================

// Brüche in der Eingabe schön mit Bruchstrich darstellen
    function prettyFractions(str){
        return str.replace(/(\d+)\s*\/\s*(\d+)/g,
            '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
    }

    function prettyEquation(str, xValueHtml){
        str = escapeHtml(str)
            .replace(/\*/g, "·")
            .replace(/(\d)x/g, "$1·x")
            .replace(/(\d)\(/g, "$1·(")
            .replace(/(\))\(/g, "$1·(");

        str = str
            .replace(/\+/g, " + ")
            .replace(/-/g, " − ")
            .replace(/·/g, " · ")
            .replace(/\s+/g, " ")
            .trim();

        str = prettyFractions(str);

        if(xValueHtml !== undefined){
            str = str.replace(
                /x/g,
                '(<span class="xVal">' + xValueHtml + '</span>)'
            );
        }

        return str;
    }

let leftInserted = prettyEquation(leftOriginal, fracHtml(x));

let rightInserted = prettyEquation(rightOriginal, fracHtml(x));

// Hier bewusst die Eingabe zeigen, nicht die bereits zusammengefasste Form.
let leftPlain = prettyEquation(leftOriginal);
let rightPlain = prettyEquation(rightOriginal);


    // ausrechnen (direkt aus den geparsten Koeffizienten,
    // kein eval() auf Nutzereingaben nötig)
    let leftValue = baseEq.left.x * x + baseEq.left.c;
    let rightValue = baseEq.right.x * x + baseEq.right.c;

    let ok = Math.abs(leftValue-rightValue) < 0.0001;

    document.getElementById("probeContent").innerHTML = `
        <div class="probeTitle">${msW("probe","🔍 Probe")}</div>

        <div class="probeRow step1">
            <span class="probeLabel">${msW("insertSol","Lösung einsetzen")}</span>
            x = <span class="xVal">${fracHtml(x)}</span>
        </div>

        <div class="probeRow step1">
            <span class="probeLabel">${msW("original","Ursprungsgleichung")}</span>
            ${leftPlain} &thinsp;=&thinsp; ${rightPlain}
        </div>

        <div class="probeRow step2">
            <span class="probeLabel">${msW("insert","Einsetzen")}</span>
            ${leftInserted} &thinsp;=&thinsp; ${rightInserted}
        </div>

        <div class="probeRow ${ok ? "ok" : "bad"}">
            <span class="probeLabel">${msW("result","Ergebnis")}</span>
            <span class="resultBig">
                ${fracHtml(leftValue)} &thinsp;=&thinsp; ${fracHtml(rightValue)}
            </span>
            <div class="verdict" style="color:${ok ? "#16a34a" : "#dc2626"};">
                ${ok ? msW("probeOk","✅ Die Probe stimmt") : msW("probeBad","❌ Die Probe stimmt nicht")}
            </div>
        </div>
    `;

    document.getElementById("probeModal").style.display = "flex";
}

function closeProbe(){
    document.getElementById("probeModal").style.display = "none";
}

// Zeigt die Lösung (x = ...) direkt, ohne die Einsetzung/Probe-Rechnung
function showSolution(){

    let a = equation.left.x - equation.right.x;
    let b = equation.right.c - equation.left.c;

    let resultHtml;

    if(a === 0){

        resultHtml =
            b === 0
            ? msW("allX","Jede Zahl ist eine Lösung (0 = 0).")
            : msW("noSol","Keine Lösung möglich (Widerspruch).");

    }else{

        let x = b / a;

        resultHtml = `x&nbsp;&nbsp;=&nbsp;&nbsp;<span class="xVal">${fracHtml(x)}</span>`;
    }

    document.getElementById("probeContent").innerHTML = `
        <div class="probeTitle" style="color:#15803d;">${msW("solution","💡 Lösung")}</div>

        <div class="probeRow ok">
            <span class="probeLabel">${msW("result","Ergebnis")}</span>
            <span class="resultBig">${resultHtml}</span>
        </div>
    `;

    document.getElementById("probeModal").style.display = "flex";
}
