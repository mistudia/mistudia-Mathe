  * { box-sizing: border-box; }

  body { margin: 0; background: #eef5ff; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  .reihe label { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 100%; }

  .knopf.hell { background: #e3eefc; color: var(--blue); }

  .merke { border-inline-start: 5px solid var(--blue); background: #f4f8ff; padding: 8px 12px; border-radius: 8px; font-size: 16px; line-height: 1.45; margin: 8px 0; }

  .fehler { color: var(--schlecht); font-weight: 700; }
  /* Regelkarten */
  .regeln { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }

  .regel { position: relative; overflow: hidden; }
  .regel > * { position: relative; z-index: 1; }
  /* die Zahl, durch die geteilt wird, groß und durchscheinend im Hintergrund */
  .regel::before { content: attr(data-d); position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); font: 900 190px/1 system-ui, sans-serif; color: var(--farbe, #4f46e5); opacity: 0.1; pointer-events: none; z-index: 2; }

  .ziffern span.p { background: #bbf7d0; border-color: #16a34a; }
  .ziffern span.n { background: #fecdd3; border-color: #e11d48; }

  .teilerliste span { font: 700 17px system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-variant-numeric: tabular-nums; }
  .paare bdi, .lauf bdi { white-space: nowrap; }
  .paare { font-size: 17px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .ergebnisZ { font-size: 21px; font-weight: 800; color: var(--blue); margin: 8px 0; line-height: 1.45; }
  #baumSvg { width: 100%; max-width: 520px; height: auto; display: block; }
  .bk { stroke: #64748b; stroke-width: 2; }
  .bz { font: 700 17px system-ui, sans-serif; fill: #1a2233; text-anchor: middle; }
  .bp { fill: #4f46e5; } .bpt { font: 800 16px system-ui, sans-serif; fill: #ffffff; text-anchor: middle; }

  /* Sieb */

  .sieb button.weg { color: #94a3b8; background: #f8fafc; text-decoration: line-through; text-decoration-thickness: 2px; }
  .sieb button.prim { background: #4f46e5; color: #ffffff; border-color: #3730a3; }
  .sieb button.eins { color: #94a3b8; background: #f1f5f9; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
