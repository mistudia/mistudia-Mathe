  .merke { border-inline-start: 5px solid var(--blue); background: #f4f8ff; padding: 8px 12px; border-radius: 8px; font-size: 16px; line-height: 1.45; }

  .reihe { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }

<div class="app">

      <p class="merke" id="rErkl"></p>

      <p class="merke" id="sHaupt"></p>

      <table class="regeln" id="regeln"></table>

      <div class="reihe">

      <ol class="lauf" id="fSchritte"></ol>

      <p class="warn" id="fWarn" hidden></p>

      <p class="auftrag" id="auftrag"></p>

      <ol class="lauf" id="uLauf" hidden></ol>
      <p><button type="button" class="knopf hell" id="weiter"></button></p>

  </section>
