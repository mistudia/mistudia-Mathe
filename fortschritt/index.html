<style>

  .zahlen { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }

  .auftrag { font-size: 18px; line-height: 1.6; margin: 4px 0 10px; }
  .tgross { display: inline-block; font-size: 28px; font-weight: 800; margin-top: 4px; }
  .antwortzeile { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .intro { text-align: center; color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 auto 12px; max-width: 760px; }
  .kz5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

  .kzK span { font-size: 14px; color: var(--muted); font-weight: 700; }
  .ax { font: 600 12px system-ui, sans-serif; fill: #4f5b6e; } .ax.heute { fill: #1565c0; font-weight: 800; }
  .zahl { font: 800 12px system-ui, sans-serif; fill: #1a2233; }

  table.ft { border-collapse: collapse; width: 100%; font-size: 15px; } table.ft th, table.ft td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; text-align: start; white-space: nowrap; }
