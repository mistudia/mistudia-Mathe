var LOC = { de:"de-DE", en:"en-US", es:"es-ES", zh:"zh-CN", fr:"fr-FR", ru:"ru-RU", ar:"ar-u-nu-latn", ja:"ja-JP", pt:"pt-BR" };
function t(k){ return (L[lang] && L[lang][k]) || L.de[k]; }
function zahl(v, max){ return new Intl.NumberFormat(LOC[lang] || "de-DE", { maximumFractionDigits: max == null ? 2 : max }).format(Math.abs(v) < 1e-9 ? 0 : v); }

var P = { a:1, b:1, c:0, d:0 };
var piModus = true;
// Wert als Vielfaches von π (z. B. "3π/4"), falls er glatt ist; sonst null
function piBruch(v){
  var q = v / Math.PI;
  for(var d = 1; d <= 12; d++){
    var n = Math.round(q * d);
    if(Math.abs(n / d - q) < 1e-6){
      if(n === 0) return "0";
      var g = (function ggt(a, b){ return b ? ggt(b, a % b) : a; })(Math.abs(n), d); n /= g; var dd = d / g;
      var z = (Math.abs(n) === 1 ? "" : Math.abs(n)) + "π";
      return (n < 0 ? "−" : "") + z + (dd > 1 ? "/" + dd : "");
    }
  }
  return null;
}
function xTxt(v){ var pb = piModus ? piBruch(v) : null; return pb != null ? pb : zahl(v); }
var BSP = { f:{a:1,b:1,c:0,d:0,col:"#e06666"}, g:{a:0.5,b:1,c:0,d:0,col:"#f2c94c"}, h:{a:1,b:2,c:0,d:0,col:"#3f9a8c"}, i:{a:1,b:1,c:1,d:0,col:"#00a3e0"}, j:{a:1,b:1,c:0,d:0.5,col:"#e91ee0"} };
var modus = "regler", alleZeigen = false, aktivBsp = null;

// Koordinaten
var W = 800, H = 460, ML = 44, MR = 14, MT = 14, MB = 34;
var X0 = -Math.PI, X1 = 2.25 * Math.PI;
function yBereich(){
  var m = 1.6;
  var liste = (modus === "bsp" && alleZeigen) ? Object.keys(BSP).map(function(k){ return BSP[k]; }) : [P];
  liste.forEach(function(q){ m = Math.max(m, Math.abs(q.a) + Math.abs(q.d) + 0.4); });
  return Math.ceil(m * 2) / 2;
}
var YM = 1.6;
function sx(x){ return ML + (x - X0) / (X1 - X0) * (W - ML - MR); }
function sy(y){ return MT + (YM - y) / (2 * YM) * (H - MT - MB); }
function el(name, attrs, text){
  var e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(text != null) e.textContent = text;
  return e;
}
function kurve(q, farbe, breite, strich){
  var d = "", n = 500;
  for(var i = 0; i <= n; i++){
    var x = X0 + (X1 - X0) * i / n, y = q.a * Math.sin(q.b * x + q.c) + q.d;
    d += (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(y).toFixed(1);
  }
  var a = { d: d, fill: "none", stroke: farbe, "stroke-width": breite, "stroke-linejoin": "round" };
  if(strich) a["stroke-dasharray"] = strich;
  return el("path", a);
}
function pfeil(svg, x1, y1, x2, y2, farbe, beide){
  var id = "pf" + farbe.replace(/[^a-z0-9]/gi, "");
  if(!svg.querySelector("#" + id)){
    var defs = svg.querySelector("defs") || svg.insertBefore(el("defs", {}), svg.firstChild);
    var m = el("marker", { id: id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
    m.appendChild(el("path", { d: "M0 0 L10 5 L0 10 z", fill: farbe }));
    defs.appendChild(m);
  }
  var a = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: farbe, "stroke-width": 3, "marker-end": "url(#" + id + ")" };
  if(beide) a["marker-start"] = "url(#" + id + ")";
  svg.appendChild(el("line", a));
}
function schild(svg, x, y, text, farbe, anker){
  var g = el("g", {});
  var tx = el("text", { x: x, y: y, "font-size": 17, "font-style": "italic", "font-family": "Cambria Math, Cambria, Times New Roman, serif", "font-weight": 700, fill: farbe, "text-anchor": anker || "middle", "dominant-baseline": "middle", "paint-order": "stroke", stroke: "#ffffff", "stroke-width": 5 }, text);
  g.appendChild(tx); svg.appendChild(g);
}
function piLabel(k){ // k Vielfache von π/2
  var s = { "-2":"−π", "-1":"−π/2", "1":"π/2", "2":"π", "3":"3π/2", "4":"2π" }[String(k)];
  return s || "";
}
function zeichne(){
  YM = yBereich();
  var svg = document.getElementById("graph");
  // Auf schmalen Bildschirmen kleinere Zeichenfläche → Beschriftungen bleiben lesbar
  var schmal = (svg.parentNode.clientWidth || 800) < 600;
  W = schmal ? 460 : 800; H = schmal ? 400 : 460;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = "";
  svg.setAttribute("aria-label", t("aria"));
  // Gitter + Achsen
  if(piModus){
    for(var k = -2; k <= 4; k++){
      var gx = sx(k * Math.PI / 2);
      svg.appendChild(el("line", { x1: gx, y1: MT, x2: gx, y2: H - MB, stroke: "#dde3ec", "stroke-width": 1 }));
      if(k) svg.appendChild(el("text", { x: gx, y: H - MB + 20, "font-size": 14, fill: "#333", "text-anchor": "middle" }, piLabel(k)));
    }
  } else {
    for(var k2 = Math.ceil(X0); k2 <= Math.floor(X1); k2++){
      var gx2 = sx(k2);
      svg.appendChild(el("line", { x1: gx2, y1: MT, x2: gx2, y2: H - MB, stroke: "#dde3ec", "stroke-width": 1 }));
      if(k2) svg.appendChild(el("text", { x: gx2, y: H - MB + 20, "font-size": 14, fill: "#333", "text-anchor": "middle" }, zahl(k2)));
    }
  }
  var schritt = YM > 3 ? 1 : 0.5;
  for(var y = -Math.floor(YM / schritt) * schritt; y <= YM + 1e-9; y += schritt){
    var gy = sy(y);
    svg.appendChild(el("line", { x1: ML, y1: gy, x2: W - MR, y2: gy, stroke: "#dde3ec", "stroke-width": 1 }));
    if(Math.abs(y) > 1e-9) svg.appendChild(el("text", { x: ML - 6, y: gy + 5, "font-size": 13, fill: "#333", "text-anchor": "end" }, zahl(y, 1)));
  }
  svg.appendChild(el("line", { x1: ML, y1: sy(0), x2: W - MR, y2: sy(0), stroke: "#555", "stroke-width": 1.5 }));
  svg.appendChild(el("line", { x1: sx(0), y1: MT, x2: sx(0), y2: H - MB, stroke: "#555", "stroke-width": 1.5 }));
  svg.appendChild(el("text", { x: sx(0) - 6, y: sy(0) + 16, "font-size": 13, fill: "#333", "text-anchor": "end" }, "0"));

  if(modus === "bsp" && alleZeigen){
    ["f", "g", "h", "i", "j"].forEach(function(k){ svg.appendChild(kurve(BSP[k], BSP[k].col, k === "f" ? 3 : 2.5)); });
    var lx = sx(-Math.PI) + 14;
    ["f", "g", "h", "i", "j"].forEach(function(k){
      var q = BSP[k]; schild(svg, lx, sy(q.a * Math.sin(q.b * (-Math.PI + 0.15) + q.c) + q.d), k, q.col, "start");
    });
    schild(svg, sx(0.75), sy(1.05 + 0.5), "a = 0,5".replace(",", zahl(0.5).indexOf(",") >= 0 ? "," : "."), "#c48a00");
    schild(svg, sx(Math.PI / 2), sy(-0.15), "b = 2", "#00a651");
    pfeil(svg, sx(0) + 4, sy(-0.05), sx(Math.PI) - 4, sy(-0.05), "#00a651", true);
    svg.appendChild(el("line", { x1: sx(-1), y1: sy(0), x2: sx(-1), y2: H - MB, stroke: "#00a3e0", "stroke-width": 2.5, "stroke-dasharray": "3 4" }));
    schild(svg, sx(-1), sy(-YM + 0.35), "x = −1", "#00a3e0");
    schild(svg, sx(-1.05), sy(0.55), "c = 1", "#00a3e0", "end");
    schild(svg, sx(0.2), sy(0.95), "d = " + zahl(0.5), "#e91ee0", "start");
  } else {
    var q = P;
    // Grundfunktion
    svg.appendChild(kurve({ a:1, b:1, c:0, d:0 }, "#e06666", 2.5, "7 6"));
    // Ruhelage
    svg.appendChild(el("line", { x1: ML, y1: sy(q.d), x2: W - MR, y2: sy(q.d), stroke: "#8aa6e6", "stroke-width": 3, "stroke-dasharray": "12 8" }));
    schild(svg, sx(2.1 * Math.PI), sy(q.d) - 14, t("rest") + " y = " + zahl(q.d), "#5d7fd0", "end");
    // eigene Kurve
    svg.appendChild(kurve(q, "#1a2b6b", 4));
    // Startpunkt der Schwingung (x = −c/b) und Periode
    var x0 = -q.c / q.b, p = 2 * Math.PI / q.b;
    while(x0 < X0 + 0.05) x0 += p;
    while(x0 > X0 + p) x0 -= p;
    if(Math.abs(q.c) > 1e-9){
      svg.appendChild(el("line", { x1: sx(-q.c / q.b), y1: MT, x2: sx(-q.c / q.b), y2: H - MB, stroke: "#00a3e0", "stroke-width": 2.5, "stroke-dasharray": "3 4" }));
      schild(svg, sx(-q.c / q.b), H - MB - 12, "x = " + xTxt(-q.c / q.b), "#0083b8");
    }
    var py = sy(q.d - Math.abs(q.a) - 0.25 * (YM > 2 ? 1 : 0.6));
    if(x0 + p <= X1){
      pfeil(svg, sx(x0) + 2, py, sx(x0 + p) - 2, py, "#6f2da8", true);
      schild(svg, (sx(x0) + sx(x0 + p)) / 2, py + 16, "p = 2π / " + zahl(q.b) + (piModus && piBruch(p) ? " = " + piBruch(p) : "") + " ≈ " + zahl(p), "#6f2da8");
    }
    // Amplitude am ersten sichtbaren Hochpunkt (bzw. Tiefpunkt bei a < 0)
    if(Math.abs(q.a) > 1e-9){
      var xm = (Math.PI / 2 - q.c) / q.b;
      while(xm < X0 + 0.3) xm += p;
      while(xm - p > X0 + 0.3) xm -= p;
      if(xm < X1 - 0.3){
        pfeil(svg, sx(xm), sy(q.d), sx(xm), sy(q.d + q.a) + (q.a > 0 ? 3 : -3), "#f0a500");
        schild(svg, sx(xm) + 10, sy(q.d + q.a / 2), "a = " + zahl(q.a), "#c48a00", "start");
      }
    }
    // Legende
    schild(svg, W - MR - 6, MT + 14, "f(x) = sin(x)", "#d04848", "end");
  }
  live();
}
function live(){
  var q = P;
  var s = 'f(x) = <span class="ka">' + zahl(q.a) + '</span> · sin(<span class="kb">' + zahl(q.b) + '</span> · x ' +
          (q.c < 0 ? '− ' : '+ ') + '<span class="kc">' + xTxt(Math.abs(q.c)) + '</span>) ' +
          (q.d < 0 ? '− ' : '+ ') + '<span class="kd">' + zahl(Math.abs(q.d)) + '</span>';
  var box = document.getElementById("live");
  box.innerHTML = (modus === "bsp" && alleZeigen) ? "" : s;
  ["a", "b", "c", "d"].forEach(function(k){ document.getElementById("o" + k).textContent = k === "c" ? xTxt(q[k]) : zahl(q[k]); document.getElementById("r" + k).value = q[k]; });
  document.getElementById("tAmp").innerHTML = t("amp") + " – " + t("here") + ': <b class="ka">a = ' + zahl(Math.abs(q.a)) + '</b>';
  document.getElementById("tPer").innerHTML = t("per") + " – " + t("here") + ': <b style="color:var(--cp)">p ' + (piModus && piBruch(2 * Math.PI / q.b) ? "= " + piBruch(2 * Math.PI / q.b) + " " : "") + '≈ ' + zahl(2 * Math.PI / q.b) + '</b>';
  document.getElementById("tRest").innerHTML = t("rest") + " – " + t("here") + ': <b class="kd">y = ' + zahl(q.d) + '</b>';
}
function setze(neu){ for(var k in neu) if(k in P) P[k] = neu[k]; zeichne(); }
function texte(){
  document.documentElement.lang = lang;
  document.title = "miStudia – " + t("title");
  document.getElementById("titel").textContent = t("title");
  document.getElementById("tVergleich").textContent = t("vergleich");
  ["A", "B", "C", "D"].forEach(function(K){ document.getElementById("tEff" + K).textContent = t("eff" + K); document.getElementById("tLab" + K).textContent = t("lab" + K); });
  document.getElementById("tabRegler").textContent = t("tabR");
  document.getElementById("tabBsp").textContent = t("tabB");
  document.getElementById("reset").textContent = t("reset");
  document.getElementById("alle").textContent = alleZeigen ? t("eins") : t("alle");
  document.getElementById("tAmpTxt").textContent = t("ampTxt");
  document.getElementById("tPerTxt").textContent = t("perTxt");
  document.getElementById("tRestTxt").textContent = t("restTxt");
  document.getElementById("tShift").textContent = t("shift");
  document.getElementById("tSkala").textContent = t("skala");
  document.getElementById("skPi").title = t("piSkala"); document.getElementById("skDez").title = t("dezSkala");
  document.querySelectorAll(".ik").forEach(function(e){
    var k = e.dataset.k, ein = FB.T[FB.lang()][k] || FB.T.de[k];
    e.innerHTML = e.parentNode.classList.contains("titel-info") ? FB.wort(k, ein[0]) : FB.knopf(k);
  });
  var lk = document.getElementById("lexKnopf");
  if(!lk){ lk = document.createElement("button"); lk.type = "button"; lk.id = "lexKnopf"; lk.className = "b-alle lex-knopf"; lk.setAttribute("data-lex", "1"); var fu = document.querySelector(".footer"); fu.parentNode.insertBefore(lk, fu); }
  lk.textContent = FB.ui("lex");
  var dez = zahl(0.5).indexOf(",") >= 0 ? "0,5" : "0.5";
  document.querySelectorAll(".bsp .kasten").forEach(function(k){ if(/0[.,]5/.test(k.textContent)) k.textContent = dez; });
  document.querySelectorAll(".bsp .m").forEach(function(m){ if(m.textContent.indexOf("f(x)") === 0) m.textContent = "f(x) = sin(x) = 1 · sin(1 · x + 0) + 0"; });
  [".info", ".eff", "#titel"].forEach(function(s){ document.querySelectorAll(s).forEach(function(e){ e.dir = lang === "ar" ? "rtl" : "ltr"; }); });
  zeichne();
}
function zeigeModus(m){
  modus = m;
  document.getElementById("tabRegler").setAttribute("aria-selected", m === "regler");
  document.getElementById("tabBsp").setAttribute("aria-selected", m === "bsp");
  document.getElementById("reglerBox").hidden = m !== "regler";
  document.getElementById("bspBox").hidden = m !== "bsp";
  zeichne();
}
["a", "b", "c", "d"].forEach(function(k){
  document.getElementById("r" + k).addEventListener("input", function(){ aktivBsp = null; markiereBsp(); P[k] = parseFloat(this.value); zeichne(); });
});
document.querySelectorAll(".klein").forEach(function(b){
  b.addEventListener("click", function(){
    var r = document.getElementById("r" + b.dataset.r), st = parseFloat(r.step);
    var v = Math.round((parseFloat(r.value) + st * parseFloat(b.dataset.s)) / st) * st;
    v = Math.min(parseFloat(r.max), Math.max(parseFloat(r.min), v));
    P[b.dataset.r] = (b.dataset.r === "c" && piModus) ? v : Math.round(v * 100) / 100; zeichne();
  });
});
document.getElementById("reset").addEventListener("click", function(){ setze({ a:1, b:1, c:0, d:0 }); });
document.getElementById("tabRegler").addEventListener("click", function(){ zeigeModus("regler"); });
var bspGeoeffnet = false;
document.getElementById("tabBsp").addEventListener("click", function(){
  if(!bspGeoeffnet){ bspGeoeffnet = true; alleZeigen = true; var al = document.getElementById("alle"); al.setAttribute("aria-pressed", "true"); al.textContent = t("eins"); markiereBsp(); }
  zeigeModus("bsp");
});
function markiereBsp(){ document.querySelectorAll(".bsp").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.bsp === aktivBsp && !alleZeigen); }); }
document.querySelectorAll(".bsp").forEach(function(b){
  b.addEventListener("click", function(){
    alleZeigen = false; aktivBsp = b.dataset.bsp;
    document.getElementById("alle").setAttribute("aria-pressed", "false");
    document.getElementById("alle").textContent = t("alle");
    markiereBsp(); setze(BSP[aktivBsp]);
  });
});
document.getElementById("alle").addEventListener("click", function(){
  alleZeigen = !alleZeigen;
  this.setAttribute("aria-pressed", alleZeigen); this.textContent = alleZeigen ? t("eins") : t("alle");
  markiereBsp(); zeichne();
});
// π-Skala: x-Achse und Regler c in Vielfachen von π (c in Schritten von π/12)
function setzeSkala(pi){
  piModus = pi;
  document.getElementById("skPi").setAttribute("aria-pressed", pi); document.getElementById("skDez").setAttribute("aria-pressed", !pi);
  var rc = document.getElementById("rc");
  if(pi){ rc.min = -Math.PI; rc.max = Math.PI; rc.step = Math.PI / 12; P.c = Math.round(P.c / (Math.PI / 12)) * Math.PI / 12; }
  else { rc.min = -3; rc.max = 3; rc.step = 0.1; }
  try { localStorage.setItem("msSinusPi", pi ? "1" : "0"); } catch(e){}
  zeichne();
}
document.getElementById("skPi").addEventListener("click", function(){ setzeSkala(true); });
document.getElementById("skDez").addEventListener("click", function(){ setzeSkala(false); });
FB.liste(["sinus", "pi", "amplitude", "periode", "fx", "zahlen", "defb", "wertb", "nst", "extrem", "sym", "abl", "wende", "beruehren", "exponent", "wurzel"]);
var rzT; window.addEventListener("resize", function(){ clearTimeout(rzT); rzT = setTimeout(zeichne, 150); });
window.MS_LANG = { apply: function(l){ if(L[l]){ lang = l; texte(); } } };
(function(){ var v = null; try { v = localStorage.getItem("msSinusPi"); } catch(e){} if(v === "0") setzeSkala(false); else setzeSkala(true); })();
texte();
</script>
