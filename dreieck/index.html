<!DOCTYPE html>
<!-- ============================================================
     dreieck/index.html – Dreiecke konstruieren (miStudia Mathe)
     Zeichenblatt mit Lineal, Zirkel und Geodreieck wie auf Papier;
     Aufgaben SSS, SWS, WSW, SsW mit Prüfung. Logik: dreieck.js,
     Texte: texte.js. Sprache aus dem Startmenü (home-button.js).
     ============================================================ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miStudia – Dreiecke konstruieren</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/home-button.css">
<style>
  :root { --blue: #1565c0; --text: #1a2233; --muted: #4f5b6e; --line: #b0b0b8; --zirkel: #c2410c; --geo: #0d9488; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #eef5ff; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .app { max-width: 1100px; margin: 0 auto; background: #ffffff; border-radius: 18px; padding: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.10); }
  #logoOben { display: block; margin: 0 auto 10px; max-width: 320px; width: 100%; height: auto; }
  h1 { text-align: center; color: var(--blue); margin: 0 0 10px; font-size: 28px; }
  .tabs { display: flex; gap: 4px; justify-content: center; margin: 0 auto 10px; background: #e3eefc; border-radius: 999px; padding: 4px; width: fit-content; max-width: 100%; }
  .tabs button { font: 700 15px system-ui, sans-serif; padding: 8px 18px; border-radius: 999px; border: 0; background: transparent; color: var(--blue); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--blue); color: #ffffff; }
  .aufgabe { border: 2px solid var(--zirkel); background: #fff7ed; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .auftrag { margin: 0 0 6px; font-size: 17px; } .auftrag b { font-family: "Cambria Math", Cambria, "Times New Roman", serif; font-size: 19px; white-space: normal; }
  .typ { color: var(--muted); font-size: 14px; }
  .schritte summary { cursor: pointer; color: var(--blue); font-weight: 700; }
  .schritte ol { margin: 6px 0; padding-inline-start: 22px; } .schritte li { margin: 3px 0; }
  .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .knopf { font: 700 15px system-ui, sans-serif; padding: 9px 16px; border-radius: 12px; border: 0; background: var(--blue); color: #ffffff; cursor: pointer; }
  .knopf.hell { background: #e3eefc; color: var(--blue); }
  .meldung { margin: 8px 0 0; font-weight: 700; } .meldung.gut { color: #1d7a3f; } .meldung.schlecht { color: #b91c1c; }
  .kats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; background: #e3eefc; border-radius: 12px; padding: 4px; }
  .kat { font: 700 14px system-ui, sans-serif; padding: 7px 4px; border: 0; border-radius: 9px; background: transparent; color: var(--blue); cursor: pointer; line-height: 1.15; }
  .kat[aria-selected="true"] { background: var(--blue); color: #ffffff; }
  .undoknoepfe { position: absolute; bottom: 8px; inset-inline-start: 8px; display: flex; gap: 6px; }
  .undoknoepfe button { width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--line); background: rgba(255,255,255,0.92); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .undoknoepfe button:disabled { opacity: 0.35; cursor: default; }
  .werkzeuge { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .wz { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; border: 2px solid var(--line); background: #ffffff; color: var(--text); cursor: pointer; font: 600 12px system-ui, sans-serif; min-width: 0; }
  .wz svg { width: 26px; height: 26px; }
  .wz span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wz[aria-pressed="true"] { border-color: var(--blue); background: #e3eefc; color: var(--blue); }
  .zeile2 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 6px; min-height: 40px; }
  .feldbox { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .feldbox input { width: 90px; font: 18px system-ui, sans-serif; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; color: var(--text); background: #ffffff; }
  .feldbox input:focus { outline: none; border-color: var(--blue); }
  .hinweis { margin: 0 0 8px; font-size: 15px; color: var(--muted); min-height: 1.4em; }
  .hinweis.warn { color: #b45309; font-weight: 700; }
  .blattbox { position: relative; border: 2px solid #9cc0e8; border-radius: 12px; overflow: hidden; background: #ffffff; }
  #blatt { display: block; width: 100%; height: 62vh; height: 62dvh; min-height: 320px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .zoomknoepfe { position: absolute; top: 8px; inset-inline-end: 8px; display: flex; flex-direction: column; gap: 6px; }
  .zoomknoepfe button, .aktionen button { width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--line); background: rgba(255,255,255,0.92); color: var(--text); font: 700 20px system-ui; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .aktionen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .aktionen button { width: auto; padding: 0 12px; gap: 6px; font-size: 15px; }
  .aktionen label { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
  .aktionen label.links { margin-inline-start: auto; cursor: help; }
  .optionen { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .optionen .knopf { padding: 7px 12px; font-size: 14px; }
  .optionen .knopf[aria-pressed="true"] { background: var(--blue); color: #ffffff; }
  .feldbox.breit input { width: 170px; }
  .gdknopf { color: var(--geo) !important; }
  .gdknopf[aria-pressed="true"] { background: var(--geo) !important; color: #ffffff !important; border-color: var(--geo) !important; }
  .info { font: 700 16px system-ui; color: #7c3aed; min-height: 0; margin: 4px 0 0; white-space: pre-line; }
  .messung { font: 700 17px system-ui; color: var(--geo); min-height: 1.3em; margin: 6px 0 0; }
  /* SVG-Inhalt */
  .strecke { stroke: #1a2233; stroke-width: 2.2; stroke-linecap: round; }
  .strecke.vor { stroke: var(--blue); stroke-dasharray: 6 4; }
  .bogen { fill: none; stroke: #6b7280; stroke-width: 1.6; }
  .bogen.vor { stroke: var(--zirkel); stroke-width: 2.4; }
  .hilfskreis { fill: none; stroke: var(--zirkel); stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.6; }
  .zirkel { fill: none; stroke: var(--zirkel); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .gelenk { fill: var(--zirkel); } .mine { fill: #1a2233; } .einstich { fill: var(--zirkel); }
  .punkt path { stroke: #1a2233; stroke-width: 2.4; stroke-linecap: round; fill: none; }
  .pname, .mass, .live { paint-order: stroke; stroke: #ffffff; stroke-linejoin: round; font-family: system-ui, sans-serif; }
  .pname { fill: #1a2233; font-weight: 800; }
  .mass { fill: var(--blue); font-weight: 700; text-anchor: middle; } .mass.winkel { fill: var(--geo); }
  .live { fill: var(--zirkel); font-weight: 800; }
  .dreieck { fill: rgba(21, 101, 192, 0.10); stroke: none; }
  .fang { fill: rgba(21, 101, 192, 0.15); stroke: var(--blue); stroke-width: 2; }
  .basis { stroke: var(--geo); stroke-width: 3; }
  .winkelbogen { fill: none; stroke: var(--geo); stroke-width: 2.5; }
  .geo { fill: rgba(13, 148, 136, 0.06); stroke: rgba(13, 148, 136, 0.5); stroke-width: 1.2; }
  .ref { stroke: #16a34a; stroke-width: 4; fill: none; opacity: 0.55; stroke-linecap: round; }
  .sym { fill: #15803d; font-weight: 800; paint-order: stroke; stroke: #ffffff; stroke-linejoin: round; font-family: system-ui, sans-serif; }
  .bem { fill: none; stroke: #7c3aed; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .bemtext { fill: #7c3aed; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-linejoin: round; font-family: system-ui, sans-serif; }
  .notiz { fill: #1a2233; paint-order: stroke; stroke: #ffffff; stroke-linejoin: round; font-family: system-ui, sans-serif; font-weight: 600; }
  .rw { fill: none; stroke: var(--geo); stroke-width: 2; } .rwpunkt { fill: var(--geo); }
  .strecke.vor.flaeche { fill: rgba(21, 101, 192, 0.06); }
  .kopie { fill: rgba(124, 58, 237, 0.12); stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 6 4; }
  .gdkoerper { fill: rgba(241, 243, 246, 0.62); stroke: #6b7280; stroke-width: 1.4; }
  .gdlinie { stroke: rgba(107, 114, 128, 0.5); stroke-width: 0.8; fill: none; }
  .gdskala { stroke: #6b7280; stroke-width: 0.9; fill: none; }
  .gdband { fill: none; stroke: rgba(250, 204, 21, 0.62); stroke-width: 5.6; }
  .gdneunzig { fill: rgba(250, 204, 21, 0.75); }
  .gdzahl { fill: #4b5563; text-anchor: middle; font-family: system-ui, sans-serif; font-weight: 500; } .gdzahl.klein { fill: #6b7280; } .gdzahl.gross { font-weight: 600; }
  .gdgriff circle { fill: rgba(255, 255, 255, 0.92); stroke: #0f766e; stroke-width: 2; }
  .gdgriff path { fill: none; stroke: #0f766e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .strecke.hilf { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 7 4; }
  .sel { fill: none; stroke: #f59e0b; stroke-width: 6; opacity: 0.55; stroke-linecap: round; }
  .selp { fill: rgba(245, 158, 11, 0.25); stroke: #d97706; stroke-width: 2; }
  .selbox { fill: rgba(245, 158, 11, 0.18); stroke: #d97706; stroke-width: 1.5; }
  .rahmen { fill: rgba(21, 101, 192, 0.08); stroke: var(--blue); stroke-width: 1.5; }
  .rahmen.kreuz { fill: rgba(22, 163, 74, 0.08); stroke: #16a34a; stroke-dasharray: 6 4; }
  .footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; } .footer a { color: var(--blue); }
  @media (max-width: 600px) {
    body { padding: 6px; } #logoOben { max-width: 210px; } .app { padding: 10px; border-radius: 14px; } h1 { font-size: 22px; }
    .werkzeuge { grid-template-columns: repeat(4, 1fr); gap: 4px; } .kat { font-size: 12px; padding: 7px 2px; }
    .wz { padding: 4px 3px; font-size: 11px; border-radius: 10px; } .wz span { white-space: normal; text-overflow: clip; text-align: center; line-height: 1.1; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; } .wz svg { width: 22px; height: 22px; }
    #blatt { height: 56vh; height: 56dvh; }
  }
</style>
</head>
<body>
<div class="app">
  <img id="logoOben" src="/img/mistudia-logo-learnbygame.png" alt="miStudia – Learn by Game">
  <h1 id="titel">Dreiecke konstruieren</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabFrei" aria-selected="true"></button>

  </div>
  <div class="aufgabe" id="aufgabe" hidden></div>
  <div class="kats" role="tablist">
    <button type="button" role="tab" class="kat" data-k="zeichnen"></button>
    <button type="button" role="tab" class="kat" data-k="konstr"></button>
    <button type="button" role="tab" class="kat" data-k="messen"></button>
    <button type="button" role="tab" class="kat" data-k="bearb"></button>

  <div class="werkzeuge" role="toolbar">
    <button type="button" class="wz" data-k="zeichnen" data-t="punkt"><svg viewBox="0 0 24 24"><path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg><span></span></button>

    <button type="button" class="wz" data-k="zeichnen" data-t="zirkel"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 6L6 20M12 6l6 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="12" cy="6" r="2" fill="currentColor"/></svg><span></span></button>

    <button type="button" class="wz" data-k="zeichnen" data-t="geo"><svg viewBox="0 0 24 24"><path d="M4 19h16M4 19L16 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 19a6 6 0 0 0-1.8-4.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span></span></button>
    <button type="button" class="wz" data-k="zeichnen" data-t="rechteck"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" fill="none" stroke="currentColor" stroke-width="2"/></svg><span></span></button>
    <button type="button" class="wz" data-k="zeichnen" data-t="vieleck"><svg viewBox="0 0 24 24"><path d="M12 3l8.5 6.2-3.2 10H6.7L3.5 9.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="mitte"><svg viewBox="0 0 24 24"><path d="M3 17L21 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="lot"><svg viewBox="0 0 24 24"><path d="M3 19h18M12 19V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15h4v4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="parallele"><svg viewBox="0 0 24 24"><path d="M3 15L16 5M8 20L21 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="msenk"><svg viewBox="0 0 24 24"><path d="M3 15h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3v19" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/><circle cx="5" cy="15" r="1.8" fill="currentColor"/><circle cx="19" cy="15" r="1.8" fill="currentColor"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="whalb"><svg viewBox="0 0 24 24"><path d="M3 20h18M3 20L18 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20L21 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/></svg><span></span></button>
    <button type="button" class="wz" data-k="konstr" data-t="kreis3"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="4" r="2" fill="currentColor"/><circle cx="5.1" cy="16" r="2" fill="currentColor"/><circle cx="18.9" cy="16" r="2" fill="currentColor"/></svg><span></span></button>
    <button type="button" class="wz" data-k="messen" data-t="messen"><svg viewBox="0 0 24 24"><path d="M4 18L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 14l3 5M17 3l4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="messen" data-t="bemassung"><svg viewBox="0 0 24 24"><path d="M4 6v12M20 6v12M4 12h16M4 12l3-2.5M4 12l3 2.5M20 12l-3-2.5M20 12l-3 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="messen" data-t="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="bearb" data-t="auswahl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M12 10l8.5 3.6-3.6 1.3 2.6 4.2-1.7 1-2.5-4.2-2.6 2.7z" fill="currentColor"/></svg><span></span></button>
    <button type="button" class="wz" data-k="bearb" data-t="trimmen"><svg viewBox="0 0 24 24"><path d="M7 3v18M3 7h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2.4"/><path d="M12.5 4l5 6M17.5 4l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="bearb" data-t="kopieren"><svg viewBox="0 0 24 24"><path d="M3 17L9 6l5 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20l6-11 5 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="2.5 2"/></svg><span></span></button>
    <button type="button" class="wz" data-k="bearb" data-t="radieren"><svg viewBox="0 0 24 24"><path d="M4 15l8-8 7 7-6 6H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 20h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span></span></button>
    <button type="button" class="wz" data-k="bearb" data-t="hand"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg><span></span></button>
  </div>
  <div class="zeile2">
    <label class="feldbox" id="feldbox"><span id="feldlabel"></span><input id="feld" type="text" inputmode="decimal" autocomplete="off"><span id="einheit">cm</span></label>
    <span class="optionen" id="optionen"></span>
  </div>
  <p class="hinweis" id="hinweis"></p>
  <div class="blattbox">
    <svg id="blatt" role="img"></svg>
    <div class="undoknoepfe">
      <button type="button" id="rueck"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button type="button" id="vor"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="zoomknoepfe">
      <button type="button" id="zplus">+</button>
      <button type="button" id="zminus">−</button>
      <button type="button" id="fit">⤢</button>
      <button type="button" id="gdBtn" class="gdknopf" aria-pressed="false"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M2 18h20L12 8z" fill="rgba(13,148,136,0.18)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 18v-1.5M8 18v-2.5M11 18v-1.5M14 18v-2.5M17 18v-1.5" stroke="currentColor" stroke-width="1.2"/><path d="M8.5 18a3.5 3.5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>
  <p class="messung" id="messung" aria-live="polite"></p>
  <p class="info" id="info" aria-live="polite"></p>
  <div class="aktionen">
    <button type="button" id="leer"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg> <span></span></button>
    <button type="button" id="bild"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> <span></span></button>
    <label id="hilfenBox" class="links"><input type="checkbox" id="hilfen" checked> <span id="tHilfen"></span></label>
    <label><input type="checkbox" id="raster"> <span id="tRaster"></span></label>
    <label><input type="checkbox" id="masse" checked> <span id="tMasse"></span></label>
  </div>
  <div class="footer">© 2026 miStudia – <a href="https://mistudia.com" target="_blank" rel="noopener">mistudia.com</a></div>
</div>
<script src="texte.js"></script>
<script src="dreieck.js"></script>
<script src="/home-button.js"></script>
</body>
</html>
