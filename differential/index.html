  .legende .l-l { border-color: #2563eb; border-top-style: dashed !important; } .legende .l-r { border-color: #dc2626; border-top-style: dashed !important; } .legende .l-K { border-color: #dc2626; } .legende .l-E { border-color: #16a34a; } .legende .l-G { border-color: #2563eb; }

<body>
<div class="app">

      <div id="aLeg"></div>
      <p class="formel" id="aFkt"></p>
      <h2 data-t="sekH"></h2>
      <p class="zeile" data-t="sekT"></p>
      <p class="formel" id="sekF"></p>
      <h2 data-t="tanH"></h2>
      <p class="zeile" data-t="tanT"></p>
      <p class="formel" id="tanF"></p>
      <p class="zeile" data-t="tabH" style="font-weight:700"></p>
      <div class="tabelle"><table class="tw" id="hTab"></table></div>
      <p class="merke" data-t="alltag"></p>
    </div>
    <div class="karte">
      <h2 data-t="diffH"></h2>
      <p class="zeile" data-t="diffT"></p>

      <div class="tabelle"><table class="tw" id="dTab"></table></div>
      <p class="merke" id="dText"></p>
    </div>

  <section id="s_regeln" hidden>

      <div class="wahl" id="rWahl"></div>

      <div class="wahl" id="bWahl"></div>

        <div>

          <p class="muted" data-t="graphT" style="font-size:14.5px"></p>

    </div>
    <div class="karte">
      <h2 data-t="wichtigH"></h2>
      <div class="tabelle"><table class="tw" id="wTab"></table></div>
    </div>
  </section>

  <section id="s_opt" hidden>
    <div class="karte">
      <div class="reihe"><label><span data-t="szL"></span> <select id="szWahl"></select></label></div>
      <div id="o_gewinn">
        <p class="zeile" id="gText"></p>
        <div class="regler">
          <label><span data-t="pL"></span> <input type="range" id="op" min="20" max="60" step="1" value="40"> <b id="opW"></b></label>

      </div>
      <div id="o_zaun" hidden>
        <p class="zeile" id="zText"></p>
        <div class="regler">
          <label><span data-t="lL"></span> <input type="range" id="oL" min="20" max="200" step="10" value="60"> <b id="oLW"></b></label>
          <label><span data-t="xL"></span> <input type="range" id="ox" min="0" max="30" step="0.5" value="10"> <b id="oxW"></b></label>
        </div>
        <div class="zwei">
          <div><svg class="graph" id="zSkizze" viewBox="0 0 300 160" style="max-width:340px"></svg><svg class="graph" id="zSvg" viewBox="0 0 640 280"></svg></div>
          <div><ol class="weg" id="zWeg"></ol></div>
        </div>
        <p class="ergebnis" id="zErg"></p>
      </div>
      <div id="o_dose" hidden>
        <p class="zeile" id="doText"></p>
        <div class="regler">
          <label><span data-t="vL"></span> <input type="range" id="oV" min="100" max="2000" step="50" value="330"> <b id="oVW"></b></label>
          <label><span data-t="rL"></span> <input type="range" id="or" min="1" max="15" step="0.1" value="5"> <b id="orW"></b></label>
        </div>
        <div class="zwei">
          <div><svg class="graph" id="doSvg" viewBox="0 0 640 280"></svg></div>
          <div><ol class="weg" id="doWeg"></ol></div>
        </div>
        <p class="ergebnis" id="doErg"></p>
      </div>
    </div>
  </section>

  <section id="s_dgl" hidden>
    <div class="karte">
      <h2 data-t="dglH"></h2>
      <p class="merke" data-t="dglE"></p>
      <div class="wahl" id="dgNav"><button type="button" data-n="begr" data-t="nav_begr"></button><button type="button" data-n="vorg" data-t="nav_vorg"></button><button type="button" data-n="loes" data-t="nav_loes"></button><button type="button" data-n="pruef" data-t="nav_pruef"></button><button type="button" data-n="fall" data-t="nav_fall"></button></div>

        <p class="zeile" data-t="b_def"></p>
        <h3 data-t="b_schreibH"></h3>

        <p class="zeile" data-t="b_punkt"></p>
        <h3 data-t="b_ordH"></h3>
        <p class="zeile" data-t="b_ord"></p>
        <div id="bOrd"></div>
        <h3 data-t="b_explH"></h3>
        <div id="bExpl"></div>
        <p class="merke" data-t="b_part"></p>
        <h3 data-t="b_quizH"></h3>
        <div id="bQuiz"></div>
      </div>
      <div id="dg_loes" class="dg-teil" hidden>
        <p class="zeile" data-t="l_text"></p>
        <div class="regler">
          <label><span data-t="kL"></span> <input type="range" id="lk" min="-1" max="2" step="0.1" value="2"> <b id="lkW"></b></label>
