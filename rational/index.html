<!DOCTYPE html>
<!-- rational/index.html – Gebrochen-rationale Funktionen (miStudia Mathe)
     Rechnen: /funktionen/rational.js (+ kern.js), Texte: /funktionen/texte.js -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miStudia – Gebrochen-rationale Funktionen</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/home-button.css">
<link rel="stylesheet" href="/funktionen/kern.css">
<style>
.r-regler-box { margin: 4px 0 12px; }
.r-regler-box summary { cursor: pointer; font-weight: 700; color: var(--blue); font-size: 16px; padding: 6px 0; }
</style>
</head>
<body>
<div class="app">
  <img id="logoOben" src="/img/mistudia-logo-learnbygame.png" alt="miStudia – Learn by Game">
  <h1 id="titel"></h1>
  <div class="modus" role="tablist">
    <button type="button" role="tab" id="modErk" aria-selected="true"></button>
    <button type="button" role="tab" id="modUeb" aria-selected="false"></button>
  </div>
  <div id="erkunden">
  <form class="eingabe-zeile" id="form" dir="ltr">
    <label for="eingabe">f(x) =</label>
    <input type="text" id="eingabe" value="(x^2 - 1)/(x - 2)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" class="knopf" id="zeichnen"></button>
  </form>
  <div class="fehler" id="fehler" role="alert"></div>
  <div class="beispiele" id="beispiele" dir="ltr"><span id="tBsp"></span></div>

  <div class="haupt">
    <div class="graph-box">
      <div class="graph-wrap"><svg id="graph" role="img"></svg><div class="zoom" id="zoom"></div></div>
      <div class="legende"><label><input type="checkbox" id="zeigeAbl"> <span id="tAbl"></span></label></div>
  <details class="r-regler-box" id="rReglerBox">
    <summary id="rReglerT"></summary>
    <p class="regler-hinweis" id="rReglerH"></p>
    <div class="regler" id="rRegler" dir="ltr">
      <div class="regel"><label for="ra"><span><span class="m" style="color:#2563eb">a</span> <span id="tra"></span></span><output id="ora"></output></label><div class="zeile"><input type="range" id="ra" min="-5" max="5" step="0.5" value="2"></div></div>
      <div class="regel"><label for="rb"><span><span class="m" style="color:#b91c1c">b</span> <span id="trb"></span></span><output id="orb"></output></label><div class="zeile"><input type="range" id="rb" min="-5" max="5" step="0.5" value="1"></div></div>
      <div class="regel"><label for="rc"><span><span class="m" style="color:#ea580c">c</span> <span id="trc"></span></span><output id="orc"></output></label><div class="zeile"><input type="range" id="rc" min="-4" max="4" step="0.5" value="1"></div></div>
    </div>
  </details>
      <p class="tipp" id="tipp"></p>
    </div>
    <div class="analyse" id="analyse"></div>
  </div>
  </div>
  <div id="ueben" class="ueben" hidden></div>
  <div class="footer">© 2026 miStudia – <a href="https://mistudia.com" target="_blank" rel="noopener">mistudia.com</a></div>
</div>

<script src="/funktionen/texte.js"></script>
<script src="/funktionen/kern.js"></script>
<script src="/funktionen/lexikon.js"></script>
<script src="/funktionen/alltag.js"></script>
<script src="/funktionen/seite.js"></script>
<script src="/funktionen/rational.js"></script>
<script>
(function(){
  var t = FK.t, C = FS.FARBE, f = FS.f, Bz = FK.Bz, M = FK.MINUS;
  var BSP = ["(x^2 - 1)/(x - 2)", "1/x", "(x + 1)/(x - 1)", "x/(x^2 + 1)", "2x^2/(x^2 - 1)", "(x^2 + 1)/x", "1/x^2", "(x^2 - 4)/(x - 2)", "(x - 1)/(x^2 - 1)", "x^3/(x^2 - 4)"];
  var POL = "#b91c1c", ASY = "#ea580c";
  var A = null, fehlerCode = null;
  var graph = new FK.Graph(document.getElementById("graph"), { zeichnen: zeichneInhalt });
  var titelZoom = FK.knoepfe(document.getElementById("zoom"), graph, passend);

  BSP.forEach(function(s){
    var b = document.createElement("button"); b.type = "button"; b.textContent = s.replace(/\^2/g, "²").replace(/\^3/g, "³").replace(/-/g, M);
    b.addEventListener("click", function(){ document.getElementById("eingabe").value = s; rechne(); });
    document.getElementById("beispiele").appendChild(b);
  });
  document.getElementById("form").addEventListener("submit", function(e){ e.preventDefault(); rechne(); });
  document.getElementById("zeigeAbl").addEventListener("change", function(){ graph.zeichne(); });
  window.addEventListener("resize", function(){ graph.zeichne(); });

  function rechne(){
    fehlerCode = null;
    try {
      var w = FR.parse(document.getElementById("eingabe").value);
      if(FK.grad(w.z) > 6 || FK.grad(w.n) > 6) throw { code: "errRatDeg" };
      A = FR.analyse(w.z, w.n);
    } catch(e){ fehlerCode = e.code || "errParse"; }
    texte();
    if(!fehlerCode) passend();
    graph.zeichne();
  }
  function fx(x){ return FR.wert(A.Zr, A.Nr, x); }
  function passend(){
    if(!A) return;
    var xs = [];
    A.luecken.forEach(function(z){ xs.push(z.x); }); A.nst.forEach(function(z){ xs.push(z.x); });
    A.ext.forEach(function(e){ xs.push(e.z.x); }); A.wp.forEach(function(w){ xs.push(w.z.x); });
    var fns = [function(x){ return A.inD(x) ? fx(x) : NaN; }];
    if(A.asym.art === "W") fns.push(function(){ return FK.wertN(A.asym.q, 0); });
    graph.passend(xs, fns);
  }
  function zeichneInhalt(g){
    if(!A) return;
    var br = A.luecken.map(function(z){ return z.x; });
    A.pole.forEach(function(p){ g.linie(p.z.x, g.v.y0, p.z.x, g.v.y1, POL, 2, "8 6"); });
    if(A.asym.art !== "P") g.kurve(function(x){ return FK.wertN(A.asym.q, x); }, ASY, 2.5, "10 7");
    if(document.getElementById("zeigeAbl").checked){
      g.kurve(A.f1, C.a1, 2.5, "8 6", br);
      g.kurve(A.f2, C.a2, 2.5, "3 5", br);
    }
    g.kurve(fx, C.f, 3.5, null, br);
    if(A.y0) g.punkt(0, A.y0.v, C.Y, null);
    A.nst.forEach(function(z, i){ g.punkt(z.x, 0, C.N, t("lblN") + (A.nst.length > 1 ? "₁₂₃₄₅₆"[i] : ""), "unten"); });
    A.ext.forEach(function(e){ g.punkt(e.z.x, e.y.v, e.art === "H" ? C.H : C.T, FS.label(t(e.art === "H" ? "lblH" : "lblT"), e.z, e.y), e.art === "H" ? "oben" : "unten"); });
    A.wp.forEach(function(w){ g.punkt(w.z.x, w.y.v, C.W, FS.label(t(w.sattel ? "lblS" : "lblW"), w.z, w.y), "oben"); });
    A.hebbar.forEach(function(h){ g.loch(h.z.x, h.y.v, POL, FS.label(t("lblL"), h.z, h.y)); });
  }
  function klammerP(p){ var s = FK.ptxt(p); return FK.grad(p) >= 1 && (/ [+−] /.test(s)) ? "(" + s + ")" : s; }
  function bruch(z, n){ return FK.grad(n) <= 0 && Bz.num(n[0]) === 1 ? FK.ptxt(z) : klammerP(z) + " / " + klammerP(n); }
  function iv(s){
    var l = s.l ? FK.xtxt(s.l.z) : M + FK.INF, r = s.r ? FK.xtxt(s.r.z) : FK.INF;
    return FK.intervall(l, r, !!s.l && !s.l.luecke, !!s.r && !s.r.luecke);
  }
  function abschn(liste, plus, minus, null_){
    return "<ul>" + liste.map(function(s){ return "<li>" + (s.s > 0 ? plus : s.s < 0 ? minus : null_) + " " + t("auf") + " " + f(iv(s)) + "</li>"; }).join("") + "</ul>";
  }
  function unendl(v){ return v > 0 ? "+" + FK.INF : M + FK.INF; }
  function texte(){
    FS.vorschau();
    document.title = "miStudia – " + t("ratTitle");
    document.getElementById("titel").textContent = t("ratTitle");
    document.getElementById("zeichnen").textContent = t("draw");
    document.getElementById("eingabe").setAttribute("aria-label", t("eingabe"));
    document.getElementById("tBsp").textContent = t("bsp");
    document.getElementById("tAbl").innerHTML = t("showAbl").replace("f′", '<b style="color:' + C.a1 + '">f′</b>').replace("f″", '<b style="color:' + C.a2 + '">f″</b>');
    document.getElementById("tipp").textContent = t("tipp");
    document.getElementById("graph").setAttribute("aria-label", t("ratTitle"));
    titelZoom();
    document.getElementById("fehler").textContent = fehlerCode ? t(fehlerCode) : "";
    var box = document.getElementById("analyse");
    if(fehlerCode || !A){ box.innerHTML = ""; return; }
    var h = "";
    var fh = f("f(x) = " + bruch(A.z, A.n));
    if(A.gekuerzt) fh += "<br>" + t("gekuerzt") + ": " + f("f(x) = " + bruch(A.Zr, A.Nr)) + ' <span class="klein-text">(x ∉ {' + A.hebbar.map(function(l){ return FK.xtxt(l.z); }).join("; ") + "})</span>";
    fh += '<div class="klein-text">' + t("zgrad", { z: Math.max(FK.grad(A.Zr), 0), n: Math.max(FK.grad(A.Nr), 0) }) + "</div>";
    h += FS.karte("f(x)", fh);
    // Definitionsbereich & Lücken
    var lt = A.luecken.map(function(z){ return FK.xtxt(z); }).join("; ");
    h += FS.karte(t("dom"), f("D = " + FK.R + (A.luecken.length ? " \\ {" + lt + "}" : "")) + '<div class="klein-text">' + t("dNote") + "</div>");
    var lh = '<div class="klein-text">' + t("nennerNull") + ": " + f(FK.ptxt(A.n) + " = 0") + "</div>";
    if(!A.luecken.length) lh += t("noLuecke");
    else lh += "<ul>" + A.pole.map(function(p){
      return "<li>" + FS.fleck(POL) + f("x = " + FK.xtxt(p.z)) + ": <b>" + FB.wort("pol", t("polst")) + "</b> " + t(p.vzw ? "mitVzw" : "ohneVzw") + (p.z.m > 1 ? ' <span class="klein-text">(' + t("vielf", { n: p.z.m }) + ")</span>" : "") + "</li>";
    }).join("") + A.hebbar.map(function(l){
      return "<li>" + FS.fleck(POL) + f("x = " + FK.xtxt(l.z)) + ": <b>" + FB.wort("hebbar", t("hebbar")) + "</b> " + f(FS.vollPunkt(t("lblL"), l.z, l.y)) + "</li>";
    }).join("") + "</ul>";
    h += FS.karte(t("luecken"), lh);
    h += FS.karte(t("sym"), t(A.sym === "Y" ? "symY" : A.sym === "O" ? "symO" : "symN").replace(/ \(.*\)$/, ""));
    h += FS.karte(t("ySchn"), A.y0 ? FS.fleck(C.Y) + f(FK.punkt(t("lblY"), "0", FK.ytxt(A.y0))) : f("0 ∉ D"));
    h += FS.karte(t("nst"), A.nst.length ? "<ul>" + A.nst.map(function(z, i){
      return "<li>" + FS.fleck(C.N) + f(FK.punkt(t("lblN") + (A.nst.length > 1 ? "₁₂₃₄₅₆"[i] : ""), FK.xtxt(z), "0")) + (z.m > 1 ? ' <span class="klein-text">(' + t("fachN", { n: z.m }) + ")</span>" : "") + "</li>";
    }).join("") + "</ul>" : t("noNst"));
    // Asymptoten
    var ah = "";
    if(A.pole.length) ah += "<ul>" + A.pole.map(function(p){ return "<li>" + FS.fleck(POL) + t("senkr") + ": " + f("x = " + FK.xtxt(p.z)) + "</li>"; }).join("") + "</ul>";
    if(A.asym.art === "P") ah += t("keineAsym");
    else {
      if(A.dz >= A.dn && A.dn > 0) ah += '<div class="klein-text">' + t("polyDiv") + ": " + f("f(x) = " + FK.ptxt(A.div.q) + (FK.grad(A.div.r) >= 0 ? " + " + bruch(A.div.r, A.Nr) : "")) + "</div>";
      var name = A.asym.art === "W" ? "waagr" : A.asym.art === "S" ? "schief" : "naeher";
      ah += FS.fleck(ASY) + t(name) + ": " + f("y = " + FK.ptxt(A.asym.q));
    }
    h += FS.karte(t("asym"), ah);
    if(A.pole.length) h += FS.karte(t("anPol"), "<ul>" + A.pole.map(function(p){
      var x = FK.xtxt(p.z);
      return "<li>" + f("x → " + x + "⁻") + " (" + t("vonL") + "): " + f("f(x) → " + unendl(p.links)) + "<br>" + f("x → " + x + "⁺") + " (" + t("vonR") + "): " + f("f(x) → " + unendl(p.rechts)) + "</li>";
    }).join("") + "</ul>");
    var uh;
    if(A.unendl) uh = "<ul><li>" + f(t("unendl", { r: "+" + FK.INF, g: unendl(A.unendl.plus) })) + "</li><li>" + f(t("unendl", { r: M + FK.INF, g: unendl(A.unendl.minus) })) + "</li></ul>";
    else uh = f(t("unendl", { r: "±" + FK.INF, g: FK.ptxt(A.asym.q) }));
    h += FS.karte(t("inf"), uh);
    // Ableitungen
    var nq = klammerP(A.Nr);
    h += FS.karte(t("abl"), FK.grad(A.Nr) > 0
      ? f("f′(x) = " + klammerP(A.P) + " / " + nq + "²") + "<br>" + f("f″(x) = " + klammerP(A.Q) + " / " + nq + "³")
      : f("f′(x) = " + FK.ptxt(FK.ableitung(A.Zr))) + "<br>" + f("f″(x) = " + FK.ptxt(FK.ableitung(FK.ableitung(A.Zr)))));
    var eh = '<div class="klein-text">' + t("notw1") + "</div>";
    if(A.ext.length || A.sattel.length){
      eh += "<ul>" + A.ext.map(function(e){
        var vz = Math.abs(e.f2) < 1e-9 ? "= 0" : e.f2 < 0 ? "< 0" : "> 0";
        var farbe = e.art === "H" ? C.H : C.T;
        var rw = FS.rechenweg([
          ["rwExt1", f("f′(x) = 0 ⇔ " + FK.ptxt(A.P) + " = 0") + " ⇒ " + f(FS.xListe(FK.nullstellen(A.P).filter(function(z){ return A.inD(z.x); })))],
          ["rwExt2", f("f″(" + FK.xtxt(e.z) + ") " + (e.f2ex ? "= " + e.f2ex + " " : "") + vz) + " ⇒ <b>" + t(e.art === "H" ? "hp" : "tp") + "</b>"],
          ["rwY", FS.einsetzenBruch(A.Zr, A.Nr, e.z, farbe) + "<br>⇒ <b>" + f(FS.vollPunkt(t(e.art === "H" ? "lblH" : "lblT"), e.z, e.y)) + "</b>"]
        ]);
        return "<li>" + FS.fleck(farbe) + f("x = " + FK.xtxt(e.z) + ": f″(x) " + (e.f2ex ? "= " + e.f2ex + " " : "") + vz) + " → <b>" + FB.wort("extrem", t(e.art === "H" ? "hp" : "tp")) + "</b> " + f(FS.vollPunkt(t(e.art === "H" ? "lblH" : "lblT"), e.z, e.y)) + rw + "</li>";
      }).join("") + A.sattel.map(function(s){ return "<li>" + FS.fleck(C.S) + FB.wort("sattel", t("sp")) + " " + f(FS.vollPunkt(t("lblS"), s.z, s.y)) + "</li>"; }).join("") + "</ul>";
    } else eh += t("noExt");
    h += FS.karte(t("ext"), eh);
    var wh = '<div class="klein-text">' + t("notw2") + "</div>";
    wh += A.wp.length ? "<ul>" + A.wp.map(function(w){ return "<li>" + FS.fleck(C.W) + f(FS.vollPunkt(t(w.sattel ? "lblS" : "lblW"), w.z, w.y)) + (w.sattel ? ' <span class="klein-text">– ' + t("sp") + "</span>" : "") + "</li>"; }).join("") + "</ul>" : t("noWp");
    h += FS.karte(t("wp"), wh);
    h += FS.karte(t("mon"), abschn(A.mon, t("steigt"), t("faellt"), t("konst")));
    h += FS.karte(t("kr"), abschn(A.kr, t("links"), t("rechts"), ""));
    h += '<div class="klein-text" style="text-align:center">' + t("note") + "</div>";
    box.innerHTML = h;
  }
  // ---------- Parameter-Regler: f(x) = a/(x − b) + c ----------
  var RT = {
    de: ["Mit Schiebereglern: f(x) = a/(x − b) + c", "Ziehe an den Reglern – Graph, Asymptoten und Rechnung ändern sich sofort. b verschiebt die Polstelle (senkrechte Asymptote x = b), c verschiebt die waagerechte Asymptote y = c, a streckt den Graphen und spiegelt ihn, wenn a negativ ist.", "Streckung", "Polstelle", "waagerechte Asymptote"],
    en: ["With sliders: f(x) = a/(x − b) + c", "Move the sliders – graph, asymptotes and analysis change at once. b moves the pole (vertical asymptote x = b), c moves the horizontal asymptote y = c, a stretches the graph and reflects it when a is negative.", "stretch", "pole", "horizontal asymptote"],
    es: ["Con controles: f(x) = a/(x − b) + c", "Mueve los controles: la gráfica, las asíntotas y el análisis cambian al instante. b desplaza el polo (asíntota vertical x = b), c desplaza la asíntota horizontal y = c, a estira la gráfica y la refleja si a es negativo.", "dilatación", "polo", "asíntota horizontal"],
    zh: ["用滑块：f(x) = a/(x − b) + c", "拖动滑块——图像、渐近线和分析会立刻改变。b 移动极点（竖直渐近线 x = b），c 移动水平渐近线 y = c，a 拉伸图像，a 为负时图像翻转。", "伸缩", "极点", "水平渐近线"],
    fr: ["Avec curseurs : f(x) = a/(x − b) + c", "Bouge les curseurs : la courbe, les asymptotes et l’étude changent tout de suite. b déplace le pôle (asymptote verticale x = b), c déplace l’asymptote horizontale y = c, a étire la courbe et la retourne si a est négatif.", "dilatation", "pôle", "asymptote horizontale"],
    ru: ["С ползунками: f(x) = a/(x − b) + c", "Двигай ползунки – график, асимптоты и исследование сразу меняются. b сдвигает полюс (вертикальная асимптота x = b), c сдвигает горизонтальную асимптоту y = c, a растягивает график и отражает его при отрицательном a.", "растяжение", "полюс", "горизонтальная асимптота"],
    ar: ["بالمؤشرات: f(x) = a/(x − b) + c", "حرّك المؤشرات – يتغير المنحنى والخطوط المقاربة والتحليل فورًا. b يزيح القطب (الخط المقارب الرأسي x = b)، و c يزيح الخط المقارب الأفقي y = c، و a يمدّ المنحنى ويعكسه إذا كان سالبًا.", "تمديد", "قطب", "خط مقارب أفقي"],
    ja: ["スライダーで：f(x) = a/(x − b) + c", "スライダーを動かすと、グラフ・漸近線・分析がすぐに変わる。b は極（たての漸近線 x = b）を動かし、c は横の漸近線 y = c を動かし、a はグラフをのばし、a が負なら反転させる。", "のび", "極", "横の漸近線"],
    pt: ["Com controles: f(x) = a/(x − b) + c", "Mova os controles – o gráfico, as assíntotas e a análise mudam na hora. b desloca o polo (assíntota vertical x = b), c desloca a assíntota horizontal y = c, a estica o gráfico e o reflete se a for negativo.", "dilatação", "polo", "assíntota horizontal"]
  };
  function rt(i){ return (RT[FK.getLang()] || RT.de)[i]; }
  function rz(v){ var s = String(v); return /^(en|zh|ja|ar)$/.test(FK.getLang()) ? s : s.replace(".", ","); }
  function reglerText(){
    document.getElementById("rReglerT").textContent = rt(0); document.getElementById("rReglerH").textContent = rt(1);
    document.getElementById("tra").textContent = rt(2); document.getElementById("trb").textContent = rt(3); document.getElementById("trc").textContent = rt(4);
    ["ra", "rb", "rc"].forEach(function(id){ document.getElementById("o" + id).textContent = rz(Number(document.getElementById(id).value)).replace("-", M); });
  }
  function ausReglern(){
    var a = Number(document.getElementById("ra").value), b = Number(document.getElementById("rb").value), c = Number(document.getElementById("rc").value);
    if(a === 0){ a = 0.5; document.getElementById("ra").value = 0.5; }
    var s = rz(a) + (b === 0 ? "/x" : "/(x" + (b > 0 ? " - " + rz(b) : " + " + rz(-b)) + ")") + (c === 0 ? "" : c > 0 ? " + " + rz(c) : " - " + rz(-c));
    document.getElementById("eingabe").value = s; reglerText(); rechne();
  }
  ["ra", "rb", "rc"].forEach(function(id){ document.getElementById(id).addEventListener("input", ausReglern); });
  document.getElementById("rReglerBox").addEventListener("toggle", function(){ if(document.getElementById("rReglerBox").open) ausReglern(); });
  reglerText();
  FS.sprache(function(){ texte(); reglerText(); graph.zeichne(); });
  FS.eingabeHilfe({ text: function(s){ var r = FR.parse(s); return "f(x) = " + bruch(r.z, r.n); },
    zeilen: [["(x^2 - 1)/(x - 2)", "hBruchF"], ["1/(x^2 - 4)", "hHoch"], ["3x/(x^2 + 1)", "hMal"], ["(0,5x + 1)/(x - 1)", "hDez"], ["(x - 1)(x + 2)/(x + 3)", "hKlammer"]] });
  FA.einbauen("rational", document.getElementById("form"), function(e){
    var tMB = document.getElementById("tabMB"); if(tMB && tMB.getAttribute("aria-selected") !== "true") tMB.click();
    document.getElementById("eingabe").value = e; FS.vorschau();
    var form = document.getElementById("form"); if(form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event("submit", { cancelable: true }));
  }, function(e){ var r = FR.parse(e); return "f(x) = " + bruch(r.z, r.n); });
  rechne();
})();
</script>
<script src="/funktionen/ueben.js"></script>
<script>FU.einbauen("rational");</script>
<script src="/home-button.js"></script>
</body>
</html>
